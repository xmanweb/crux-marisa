name: 🔍 内核分支补丁排查

on:
  workflow_dispatch: # 支持在网页上点击按钮手动触发

jobs:
  check-branches:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出完整代码仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整历史和所有分支

      - name: 📊 运行自动化排查脚本
        run: |
          echo "正在拉取所有远程分支..."
          git fetch --all --prune --tags > /dev/null 2>&1

          # 初始化 Job Summary 表格表头
          echo "### 📱 小米 9 Pro (crux) 内核分支排查报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 分支名称 (Branch) | 最后提交时间 | KernelSU-Next | SUSFS |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :---: | :---: |" >> $GITHUB_STEP_SUMMARY

          # 获取所有远程分支（排除 HEAD 指针），并按提交时间从新到旧排序
          branches=$(git branch -r --sort=-committerdate | sed 's/^[[:space:]]*//' | grep -v "HEAD ->")

          for remote_branch in $branches; do
              # 提取纯粹的分支名 (例如 origin/main -> main)
              branch_name=${remote_branch#origin/}
              
              # 获取最后提交时间
              commit_date=$(git log -1 --format="%cd" --date=format:'%Y-%m-%d %H:%M:%S' "$remote_branch" 2>/dev/null || echo "未知时间")
              
              # ==========================================
              # 1. 严格检测 KernelSU-Next (仅看当前代码，不看历史)
              # ==========================================
              # 检查当前文件树是否存在 kernelsu 目录
              has_ksu_dir=$(git ls-tree -r "$remote_branch" --name-only 2>/dev/null | grep -E "drivers/kernelsu|ksu" || true)
              # 仅在当前分支的最新文件内容中检索关键字 (通过指定树对象 $remote_branch，git grep 只查当前状态)
              has_ksu_text=$(git grep -i "ksu_next" "$remote_branch" -- Kconfig Makefile drivers/ 2>/dev/null || true)
              
              if [ -n "$has_ksu_dir" ] || [ -n "$has_ksu_text" ]; then
                  ksu_status="❌ 已嵌入"
              else
                  ksu_status="✅ 干净"
              fi
              
              # ==========================================
              # 2. 严格检测 SUSFS (仅看当前代码，不看历史)
              # ==========================================
              # 检查当前文件树中是否有带 susfs 的文件
              has_susfs_dir=$(git ls-tree -r "$remote_branch" --name-only 2>/dev/null | grep -i "susfs" || true)
              # 仅在当前分支的最新代码文件（如 fs/, include/, drivers/）中检索 susfs 关键字
              has_susfs_text=$(git grep -i "susfs" "$remote_branch" -- Kconfig Makefile include/ fs/ drivers/ 2>/dev/null || true)
              
              if [ -n "$has_susfs_dir" ] || [ -n "$has_susfs_text" ]; then
                  susfs_status="❌ 已嵌入"
              else
                  susfs_status="✅ 干净"
              fi
              
              # 4. 将结果写入 GitHub Actions 网页摘要
              echo "| \`$branch_name\` | $commit_date | $ksu_status | $susfs_status |" >> $GITHUB_STEP_SUMMARY
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 💡 **提示**：本报告仅针对各分支的**当前最终代码状态**进行扫描。即使过去集成过但当前已彻底 revert 或清除，也会显示为 **✅ 干净**。" >> $GITHUB_STEP_SUMMARY
