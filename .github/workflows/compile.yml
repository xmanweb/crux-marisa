name: "Compile Crux Kernel (Customizable)"

on:
  push:
    branches:
      - A16-test
  workflow_dispatch:
    inputs:
      hook_type:
        description: '选择 ReSukiSU 挂钩类型 (二选一)'
        required: true
        default: 'inline_susfs'
        type: choice
        options:
          - 'inline_susfs'
          - 'manual_hook'
      enable_bbg:
        description: '开启 Baseband Guard 🛡️'
        required: false
        default: true
        type: boolean
      enable_rekernel:
        description: '开启 ReKernel 调度引擎 ⚡'
        required: false
        default: true
        type: boolean
      enable_droidspaces:
        description: '开启 Droidspaces & Docker 容器支持 🐳'
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FINAL_ZIP_NAME: ""
      NO_DTB_ZIP_NAME: ""
      HOOK_TYPE: ${{ github.event.inputs.hook_type || 'inline_susfs' }}
      ENABLE_BBG: ${{ github.event.inputs.enable_bbg || 'true' }}
      ENABLE_REKERNEL: ${{ github.event.inputs.enable_rekernel || 'true' }}
      ENABLE_DROIDSPACES: ${{ github.event.inputs.enable_droidspaces || 'true' }}
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: A16-test

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev texinfo \
            libgmp3-dev libmpfr-dev libmpc-dev libcap-dev zlib1g-dev python3 \
            bison flex ccache libelf-dev lz4 liblz4-tool libstdc++6 openjdk-11-jdk zip unzip curl git coccinelle

      - name: Fetch ZyC-Clang 16 Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          curl -LO https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz
          mkdir -p zyc-clang
          tar -xzf Clang-16.0.6-20260510.tar.gz -C zyc-clang

      - name: "PHASE 1: Apply SUSFS 4.14 Baseline Patch"
        if: env.HOOK_TYPE == 'inline_susfs'
        run: |
          cd $GITHUB_WORKSPACE
          curl -fsSL "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/Patch/susfs_patch_to_4.14.patch" -o susfs_to_414.patch
          if [ -f "susfs_to_414.patch" ]; then
            patch -p1 < susfs_to_414.patch || echo "Notice: Some hunks failed. Catching rejections below..."
          fi

      - name: "PHASE 1.5: Intercept & Manually Rescue Failed Hunks (Script Driven)"
        if: env.HOOK_TYPE == 'inline_susfs'
        run: |
          cd $GITHUB_WORKSPACE
          find . -name "*.rej" -delete
          find . -name "*.orig" -delete
          if [ -f ".github/workflows/rescue_hunks.sh" ]; then
            chmod +x .github/workflows/rescue_hunks.sh
            ./.github/workflows/rescue_hunks.sh
          else
            echo "❌ CRITICAL: rescue_hunks.sh not found!" && exit 1
          fi

      - name: "PHASE 2: Integrate Official ReSukiSU"
        run: |
          cd $GITHUB_WORKSPACE
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main || curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: "PHASE 3: Apply JackA1ltman Native Non-GKI Core Infrastructure (Inline)"
        if: env.HOOK_TYPE == 'inline_susfs'
        run: |
          cd $GITHUB_WORKSPACE
          curl -fsSL "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/susfs_inline_hook_patches.sh" -o susfs_inline_hook_patches.sh
          chmod +x susfs_inline_hook_patches.sh
          bash susfs_inline_hook_patches.sh || echo "Notice: VFS tree adaptation finished."

      - name: "PHASE 3: Inject ReSukiSU Manual Hooks via Remote Trusted Script"
        if: env.HOOK_TYPE == 'manual_hook'
        run: |
          cd $GITHUB_WORKSPACE
          echo "====================================================================="
          echo " 🚀 FETCHING & RUNNING REMOTE SYSCALL HOOK PATCHES SCRIPT"
          echo "====================================================================="
          curl -fsSL "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/syscall_hook_patches.sh" -o syscall_hook_patches.sh
          if [ -f "syscall_hook_patches.sh" ]; then
            chmod +x syscall_hook_patches.sh
            ./syscall_hook_patches.sh
            rm -f syscall_hook_patches.sh
            echo "✅ Syscall manual hooks successfully processed by script."
          else
            echo "❌ CRITICAL ERROR: Failed to download syscall_hook_patches.sh!" && exit 1
          fi

      - name: "PHASE 4-1: Advanced Patch Integration Baseband-guard"
        if: env.ENABLE_BBG == 'true'
        run: |
          cd $GITHUB_WORKSPACE
          TARGET_CONFIG="arch/arm64/configs/crux_defconfig"
          if [ ! -f "$TARGET_CONFIG" ]; then
            echo "❌ ERROR: $TARGET_CONFIG not found!" && exit 1
          fi
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          if grep -q "config LSM" security/Kconfig; then
            sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
          fi
          echo "CONFIG_BBG=y" >> "$TARGET_CONFIG"
          echo "[+] Patched Baseband Guard Successfully."
      
      - name: "PHASE 4-2: Advanced Patch Integration Re-kernel"
        if: env.ENABLE_REKERNEL == 'true'
        run: |
          cd $GITHUB_WORKSPACE
          TARGET_CONFIG="arch/arm64/configs/crux_defconfig"
          if [ ! -f "$TARGET_CONFIG" ]; then
            echo "❌ ERROR: $TARGET_CONFIG not found!" && exit 1
          fi         
          curl -fsSL "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/Rekernel/rekernel_patches.sh" -o rekernel_patches.sh
          chmod +x rekernel_patches.sh
          bash rekernel_patches.sh || echo "Notice: Rekernel patches adaptation executed."

          mkdir -p drivers/net/rekernel/
          curl -fsSL "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/Rekernel/rekernel_extra.patch" -o rekernel_extra.patch
          if [ -f "rekernel_extra.patch" ]; then
            patch -p1 < rekernel_extra.patch || echo "Notice: Some ReKernel extra hunks skipped or resolved."
          fi
          echo "CONFIG_REKERNEL=y" >> "$TARGET_CONFIG"
          echo "[+] Patched Re:Kernel Successfully."

      - name: "PHASE 4-3: Advanced Patch Integrate Droidspaces & Docker Container Infrastructure"
        if: env.ENABLE_DROIDSPACES == 'true'
        run: |
          cd $GITHUB_WORKSPACE
          TARGET_CONFIG="arch/arm64/configs/crux_defconfig"

          echo "====================================================================="
          echo " 🐳 STEP 1: FETCHING & INJECTING DROIDSPACES CONFIG"
          echo "====================================================================="
          curl -fsSL "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/Droidspaces/droidspaces.config" -o droidspaces.config
          if [ -f "droidspaces.config" ]; then
            cat droidspaces.config >> "$TARGET_CONFIG"
            rm -f droidspaces.config
          else
            echo "❌ ERROR: Failed to download droidspaces.config!" && exit 1
          fi

          sed -i 's/CONFIG_ANDROID_PARANOID_NETWORK=y/CONFIG_ANDROID_PARANOID_NETWORK=n/g' "$TARGET_CONFIG"
          echo "CONFIG_ANDROID_PARANOID_NETWORK=n" >> "$TARGET_CONFIG"

          echo "====================================================================="
          echo " 🧬 STEP 2: DOWNLOADING COCCINELLE SEMANTIC PATCHES"
          echo "====================================================================="
          curl -fsSL "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/Droidspaces/fix_kernel_panic_in_xt_qtaguid.cocci" -o fix_kernel_panic_in_xt_qtaguid.cocci
          curl -fsSL "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/Droidspaces/fix_restore_cgroup_file_prefix_handling.cocci" -o fix_restore_cgroup_file_prefix_handling.cocci

          echo "====================================================================="
          echo " 🛠️  STEP 3: RUNNING SPATCH SEMANTIC INJECTIONS"
          echo "====================================================================="
          if [ -f "net/netfilter/xt_qtaguid.c" ] && [ -f "fix_kernel_panic_in_xt_qtaguid.cocci" ]; then
            spatch --sp-file fix_kernel_panic_in_xt_qtaguid.cocci --in-place net/netfilter/xt_qtaguid.c
          fi

          key_file=""
          if [ -f "kernel/cgroup/cgroup.c" ]; then key_file="kernel/cgroup/cgroup.c";
          elif [ -f "kernel/cgroup.c" ]; then key_file="kernel/cgroup.c"; fi

          if [ -n "$key_file" ] && [ -f "fix_restore_cgroup_file_prefix_handling.cocci" ]; then
            if ! grep -q "kernfs_create_link" "$key_file"; then
              spatch --sp-file fix_restore_cgroup_file_prefix_handling.cocci --in-place "$key_file"
            fi
          else
            echo "❌ CRITICAL ERROR: Could not find cgroup.c core logic." && exit 1
          fi
          rm -f fix_kernel_panic_in_xt_qtaguid.cocci fix_restore_cgroup_file_prefix_handling.cocci

          echo "====================================================================="
          echo " 🩹 STEP 4: HOTFIXING NETPRIO CGROUP OLD-KERNEL ID CONFLICT"
          echo "====================================================================="
          NETPRIO_HEADER="include/net/netprio_cgroup.h"
          NETPRIO_SOURCE="net/core/netprio_cgroup.c"

          if [ -f "$NETPRIO_HEADER" ]; then sed -i 's/idx = css->cgroup->id;/idx = cgroup_id(css->cgroup);/g' "$NETPRIO_HEADER"; fi
          if [ -f "$NETPRIO_SOURCE" ]; then sed -i 's/css->cgroup->id/cgroup_id(css->cgroup)/g' "$NETPRIO_SOURCE"; fi

      - name: Start Kernel Compilation
        run: |
          cd $GITHUB_WORKSPACE
          if [ -d "$GITHUB_WORKSPACE/toolchain/zyc-clang/bin" ]; then
            REAL_CLANG_PATH="$GITHUB_WORKSPACE/toolchain/zyc-clang/bin"
          else
            REAL_CLANG_PATH="$GITHUB_WORKSPACE/toolchain/zyc-clang"
          fi
          export PATH=$REAL_CLANG_PATH:$PATH

          make O=out ARCH=arm64 crux_defconfig
          
          # 基础 KSU / Clang 配置
          ./scripts/config --file out/.config \
              -e KSU \
              -e THREAD_INFO_IN_TASK \
              -e KSU_MULTI_MANAGER_SUPPORT \
              -e BUILD_ARM64_DT_OVERLAY

          # 动态注入所选 Hook 类型的特定内核配置
          if [ "${{ env.HOOK_TYPE }}" = "inline_susfs" ]; then
            ./scripts/config --file out/.config \
                -e KSU_SUSFS \
                -e KSU_SUSFS_SUS_PATH \
                -e KSU_SUSFS_SUS_MOUNT \
                -e KSU_SUSFS_SUS_KSTAT \
                -e KSU_SUSFS_SPOOF_UNAME \
                -e KSU_SUSFS_ENABLE_LOG \
                -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
                -e KSU_SUSFS_OPEN_REDIRECT \
                -e KSU_SUSFS_SUS_MAP
          else
            ./scripts/config --file out/.config \
                -e KSU_MANUAL_HOOK \
                -e KSU_MANUAL_HOOK_AUTO_INPUT_HOOK \
                -e KSU_MANUAL_HOOK_AUTO_SETUID_HOOK \
                -e KSU_MANUAL_HOOK_AUTO_INITRC_HOOK
          fi

          make O=out ARCH=arm64 silentoldconfig

          make -j$(nproc --all) \
                      ARCH=arm64 \
                      SUBARCH=arm64 \
                      O=out \
                      CC=clang \
                      HOSTCC=clang \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
                      LD=ld.lld \
                      AR=llvm-ar \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip

      - name: Pack Kernel with AnyKernel3 (Dynamic Variable Naming)
        run: |
          cd $GITHUB_WORKSPACE
          BUILD_DATE=$(date -d "+8 hours" +%Y%m%d_%H%M)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          
          # 根据勾选状态动态计算特性标签 (用于文件名和刷机信息)
          FEATURE_TAGS=""
          if [ "${{ env.HOOK_TYPE }}" = "inline_susfs" ]; then FEATURE_TAGS="resukisu-susfs"; else FEATURE_TAGS="resukisu-manual"; fi
          if [ "${{ env.ENABLE_BBG }}" = "true" ]; then FEATURE_TAGS="${FEATURE_TAGS}-bbg"; fi
          if [ "${{ env.ENABLE_REKERNEL }}" = "true" ]; then FEATURE_TAGS="${FEATURE_TAGS}-rekernel"; fi
          if [ "${{ env.ENABLE_DROIDSPACES }}" = "true" ]; then FEATURE_TAGS="${FEATURE_TAGS}-droidspaces"; fi

          ZIP_FULL="crux-kernel-${FEATURE_TAGS}-${BUILD_DATE}-${SHORT_SHA}-With-DTB.zip"
          ZIP_NODTB="crux-kernel-${FEATURE_TAGS}-${BUILD_DATE}-${SHORT_SHA}-No-DTB.zip"
          
          echo "FINAL_ZIP_NAME=${ZIP_FULL}" >> $GITHUB_ENV
          echo "NO_DTB_ZIP_NAME=${ZIP_NODTB}" >> $GITHUB_ENV
          
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3_with_dtb
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3_no_dtb
          
          rm -rf ak3_with_dtb/.git ak3_with_dtb/README.md ak3_with_dtb/Image* ak3_with_dtb/zImage*
          rm -rf ak3_no_dtb/.git ak3_no_dtb/README.md ak3_no_dtb/Image* ak3_no_dtb/zImage*
          
          define_properties() {
            local target_script="$1"
            local track_mode="$2"
            echo '# AnyKernel3 Ramdisk Mod Script' > "$target_script"
            echo 'properties() { ' >> "$target_script"
            echo "kernel.string=Mi9Pro crux [${FEATURE_TAGS}] - ${track_mode} - ${BUILD_DATE}" >> "$target_script"
            echo 'do.devicecheck=1; do.modules=0; do.systemless=1; do.cleanup=1; do.cleanuponabort=1;' >> "$target_script"
            echo "device.name1=crux" >> "$target_script"
            echo '} ' >> "$target_script"
            echo 'BLOCK=boot; IS_SLOT_DEVICE=0; RAMDISK_COMPRESSION=auto; PATCH_VBMETA_FLAG=auto;' >> "$target_script"
            echo '. /tmp/anykernel/tools/ak3-core.sh;' >> "$target_script"
            echo 'split_boot;' >> "$target_script"
            echo 'flash_boot;' >> "$target_script"
            if [ "$track_mode" = "With-DTB" ]; then
              if [ -f "out/arch/arm64/boot/dtbo.img" ]; then echo 'flash_dtbo;' >> "$target_script"; fi
            fi
          }
          
          define_properties "ak3_with_dtb/anykernel.sh" "With-DTB"
          define_properties "ak3_no_dtb/anykernel.sh" "No-DTB"

          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then cp out/arch/arm64/boot/Image.gz-dtb ak3_with_dtb/Image.gz-dtb; else exit 1; fi
          if [ -f "out/arch/arm64/boot/dtbo.img" ]; then cp out/arch/arm64/boot/dtbo.img ak3_with_dtb/dtbo.img; fi

          if [ -f "out/arch/arm64/boot/Image" ]; then gzip -c out/arch/arm64/boot/Image > ak3_no_dtb/Image.gz; else exit 1; fi

          cd ak3_with_dtb && zip -r ../${ZIP_FULL} * && cd ..
          cd ak3_no_dtb && zip -r ../${ZIP_NODTB} * && cd ..

      - name: Upload Both Kernel Zips
        uses: actions/upload-artifact@v4
        with:
          name: crux-compiled-kernels
          path: |
            ${{ env.FINAL_ZIP_NAME }}
            ${{ env.NO_DTB_ZIP_NAME }}
