name: "Compile Crux Kernel"

on:
  push:
    branches:
      - A16-test
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FINAL_ZIP_NAME: ""
      NO_DTB_ZIP_NAME: ""
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: A16-test

      - name: Install Dependencies
        run: |
          # 1. 瞬间将默认源替换为腾讯云镜像源
          sudo sed -i 's/[a-zA-Z0-9.-]*\.archive\.ubuntu\.com/mirrors.tencent.com/g' /etc/apt/sources.list
          sudo sed -i 's/security\.ubuntu\.com/mirrors.tencent.com/g' /etc/apt/sources.list
          
          # 2. 重新跑 update 并安装
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev texinfo \
            libgmp3-dev libmpfr-dev libmpc-dev libcap-dev zlib1g-dev python3 \
            bison flex ccache libelf-dev lz4 liblz4-tool libstdc++6 openjdk-11-jdk zip unzip curl git coccinelle

      - name: Fetch ZyC-Clang 16 Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          curl -LO https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz
          mkdir -p zyc-clang
          tar -xzf Clang-16.0.6-20260510.tar.gz -C zyc-clang

      - name: "PHASE 2: Integrate Official ReSukiSU"
        run: |
          cd $GITHUB_WORKSPACE
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main || curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: "PHASE 2.5: Inject ReSukiSU Manual Hooks via Pure Clean Echo Patches"
        run: |
          cd $GITHUB_WORKSPACE
          echo "Starting full spectrum clean injection..."

          # ==========================================
          # 1. fs/stat.c Hooking
          # ==========================================
          if [ -f "fs/stat.c" ]; then
            echo "--- Patching fs/stat.c ---"
            rm -f ksu_stat.patch
            echo '--- a/fs/stat.c' >> ksu_stat.patch
            echo '+++ b/fs/stat.c' >> ksu_stat.patch
            echo '@@ -1,3 +1,11 @@' >> ksu_stat.patch
            echo ' #include <linux/file.h>' >> ksu_stat.patch
            echo '+#ifdef CONFIG_KSU_MANUAL_HOOK' >> ksu_stat.patch
            echo '+__attribute__((hot)) extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);' >> ksu_stat.patch
            echo '+extern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);' >> ksu_stat.patch
            echo ' +#if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)' >> ksu_stat.patch
            echo '+extern void ksu_handle_fstat64_ret(unsigned long *fd, struct stat64 __user **statbuf_ptr);' >> ksu_stat.patch
            echo ' +#endif' >> ksu_stat.patch
            echo ' +#endif' >> ksu_stat.patch
            echo '@@ -359,4 +367,7 @@ int vfs_fstatat(int dfd, const char __user *filename, struct kstat *stat,' >> ksu_stat.patch
            echo ' SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename, struct stat __user *, statbuf, int, flag) {' >> ksu_stat.patch
            echo ' 	struct kstat stat;' >> ksu_stat.patch
            echo ' 	int error;' >> ksu_stat.patch
            echo '+#ifdef CONFIG_KSU_MANUAL_HOOK' >> ksu_stat.patch
            echo '+	ksu_handle_stat(&dfd, &filename, &flag);' >> ksu_stat.patch
            echo '+#endif' >> ksu_stat.patch
            echo ' 	error = vfs_fstatat(dfd, filename, &stat, flag);' >> ksu_stat.patch
            echo '@@ -503,4 +514,7 @@ int vfs_fstatat(int dfd, const char __user *filename, struct kstat *stat,' >> ksu_stat.patch
            echo ' SYSCALL_DEFINE4(fstatat64, int, dfd, const char __user *, filename, struct stat64 __user *, statbuf, int, flag) {' >> ksu_stat.patch
            echo ' 	struct kstat stat;' >> ksu_stat.patch
            echo ' 	int error;' >> ksu_stat.patch
            echo '+#ifdef CONFIG_KSU_MANUAL_HOOK' >> ksu_stat.patch
            echo '+	ksu_handle_stat(&dfd, &filename, &flag);' >> ksu_stat.patch
            echo '+#endif' >> ksu_stat.patch
            echo ' 	error = vfs_fstatat(dfd, filename, &stat, flag);' >> ksu_stat.patch
            echo '@@ -364,4 +378,7 @@ int vfs_fstatat(int dfd, const char __user *filename, struct kstat *stat,' >> ksu_stat.patch
            echo ' 	if (!error)' >> ksu_stat.patch
            echo ' 		error = cp_new_stat(&stat, statbuf);' >> ksu_stat.patch
            echo '+#ifdef CONFIG_KSU_MANUAL_HOOK' >> ksu_stat.patch
            echo '+	ksu_handle_newfstat_ret(&fd, &statbuf);' >> ksu_stat.patch
            echo '+#endif' >> ksu_stat.patch
            echo ' 	return error;' >> ksu_stat.patch
            echo '@@ -490,4 +507,7 @@ int vfs_fstatat(int dfd, const char __user *filename, struct kstat *stat,' >> ksu_stat.patch
            echo ' 	if (!error)' >> ksu_stat.patch
            echo ' 		error = cp_new_stat64(&stat, statbuf);' >> ksu_stat.patch
            echo '+#ifdef CONFIG_KSU_MANUAL_HOOK' >> ksu_stat.patch
            echo '+	ksu_handle_fstat64_ret(&fd, &statbuf);' >> ksu_stat.patch
            echo '+#endif' >> ksu_stat.patch
            echo ' 	return error;' >> ksu_stat.patch

            if ! patch -p1 < ksu_stat.patch; then
              echo "Fallback sed for fs/stat.c"
              sed -i '1i #ifdef CONFIG_KSU_MANUAL_HOOK\n__attribute__((hot)) extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\nextern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);\n#if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)\nextern void ksu_handle_fstat64_ret(unsigned long *fd, struct stat64 __user **statbuf_ptr);\n#endif\n#endif' fs/stat.c
              sed -i 's/error = vfs_fstatat(dfd, filename, &stat, flag);/#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_stat(\&dfd, \&filename, \&flag);\n#endif\n\terror = vfs_fstatat(dfd, filename, \&stat, flag);/g' fs/stat.c
              sed -i 's/error = cp_new_stat(&stat, statbuf);/error = cp_new_stat(\&stat, statbuf);\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_newfstat_ret(\&fd, \&statbuf);\n#endif/g' fs/stat.c
              sed -i 's/error = cp_new_stat64(&stat, statbuf);/error = cp_new_stat64(\&stat, statbuf);\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_fstat64_ret(\&fd, \&statbuf);\n#endif/g' fs/stat.c
            fi
            rm -f ksu_stat.patch
          fi

          # ==========================================
          # 2. fs/open.c Hooking (4.19- faccessat)
          # ==========================================
          if [ -f "fs/open.c" ]; then
            echo "--- Patching fs/open.c ---"
            rm -f ksu_open.patch
            echo '--- a/fs/open.c' >> ksu_open.patch
            echo '+++ b/fs/open.c' >> ksu_open.patch
            echo '@@ -1,3 +1,7 @@' >> ksu_open.patch
            echo ' #include <linux/vfs.h>' >> ksu_open.patch
            echo '+#ifdef CONFIG_KSU_MANUAL_HOOK' >> ksu_open.patch
            echo '+__attribute__((hot)) extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);' >> ksu_open.patch
            echo ' +#endif' >> ksu_open.patch
            echo '@@ -369,3 +373,6 @@ SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)' >> ksu_open.patch
            echo ' 	unsigned int lookup_flags = LOOKUP_FOLLOW;' >> ksu_open.patch
            echo ' ' >> ksu_open.patch
            echo '+#ifdef CONFIG_KSU_MANUAL_HOOK' >> ksu_open.patch
            echo '+	ksu_handle_faccessat(&dfd, &filename, &mode, NULL);' >> ksu_open.patch
            echo '+#endif' >> ksu_open.patch
            echo ' 	if (mode & ~S_IRWXO)' >> ksu_open.patch

            if ! patch -p1 < ksu_open.patch; then
              echo "Fallback sed for fs/open.c"
              sed -i '1i #ifdef CONFIG_KSU_MANUAL_HOOK\n__attribute__((hot)) extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n#endif' fs/open.c
              sed -i 's/if (mode & ~S_IRWXO)/#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_faccessat(\&dfd, \&filename, \&mode, NULL);\n#endif\n\tif (mode \& ~S_IRWXO)/g' fs/open.c
            fi
            rm -f ksu_open.patch
          fi

          # ==========================================
          # 3. kernel/reboot.c Hooking (3.11+)
          # ==========================================
          if [ -f "kernel/reboot.c" ]; then
            echo "--- Patching kernel/reboot.c ---"
            rm -f ksu_reboot.patch
            echo '--- a/kernel/reboot.c' >> ksu_reboot.patch
            echo '+++ b/kernel/reboot.c' >> ksu_reboot.patch
            echo '@@ -1,3 +1,6 @@' >> ksu_reboot.patch
            echo ' #include <linux/ctype.h>' >> ksu_reboot.patch
            echo '+#ifdef CONFIG_KSU_MANUAL_HOOK' >> ksu_reboot.patch
            echo '+extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);' >> ksu_reboot.patch
            echo ' +#endif' >> ksu_reboot.patch
            echo '@@ -284,3 +287,6 @@ SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,' >> ksu_reboot.patch
            echo ' 	char buffer[256];' >> ksu_reboot.patch
            echo ' 	int ret = 0;' >> ksu_reboot.patch
            echo ' ' >> ksu_reboot.patch
            echo '+#ifdef CONFIG_KSU_MANUAL_HOOK' >> ksu_reboot.patch
            echo '+	ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);' >> ksu_reboot.patch
            echo '+#endif' >> ksu_reboot.patch
            echo ' 	/* We only trust the superuser with rebooting the system. */' >> ksu_reboot.patch

            if ! patch -p1 < ksu_reboot.patch; then
              echo "Fallback sed for kernel/reboot.c"
              sed -i '1i #ifdef CONFIG_KSU_MANUAL_HOOK\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n#endif' kernel/reboot.c
              sed -i 's/if (!ns_capable(pid_ns->user_ns, CAP_SYS_BOOT))/#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_sys_reboot(magic1, magic2, cmd, \&arg);\n#endif\n\tif (!ns_capable(pid_ns->user_ns, CAP_SYS_BOOT))/g' kernel/reboot.c
            fi
            rm -f ksu_reboot.patch
          fi

          # ==========================================
          # 4. drivers/input/input.c Hooking
          # ==========================================
          if [ -f "drivers/input/input.c" ]; then
            echo "--- Patching drivers/input/input.c ---"
            rm -f ksu_input.patch
            echo '--- a/drivers/input/input.c' >> ksu_input.patch
            echo '+++ b/drivers/input/input.c' >> ksu_input.patch
            echo '@@ -1,3 +1,7 @@' >> ksu_input.patch
            echo ' #include <linux/init.h>' >> ksu_input.patch
            echo '+#ifdef CONFIG_KSU_MANUAL_HOOK' >> ksu_input.patch
            echo '+extern bool ksu_input_hook __read_mostly;' >> ksu_input.patch
            echo '+extern __attribute__((cold)) int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);' >> ksu_input.patch
            echo ' +#endif' >> ksu_input.patch
            echo '@@ -436,3 +440,7 @@ void input_event(struct input_dev *dev,' >> ksu_input.patch
            echo ' {' >> ksu_input.patch
            echo ' 	unsigned long flags;' >> ksu_input.patch
            echo ' ' >> ksu_input.patch
            echo '+#ifdef CONFIG_KSU_MANUAL_HOOK' >> ksu_input.patch
            echo '+	if (unlikely(ksu_input_hook)) ksu_handle_input_handle_event(&type, &code, &value);' >> ksu_input.patch
            echo '+#endif' >> ksu_input.patch
            echo ' 	if (is_event_supported(type, dev->evbit, EV_MAX)) {' >> ksu_input.patch

            if ! patch -p1 < ksu_input.patch; then
              echo "Fallback sed for drivers/input/input.c"
              sed -i '1i #ifdef CONFIG_KSU_MANUAL_HOOK\nextern bool ksu_input_hook __read_mostly;\nextern __attribute__((cold)) int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);\n#endif' drivers/input/input.c
              sed -i 's/if (is_event_supported(type, dev->evbit, EV_MAX))/#ifdef CONFIG_KSU_MANUAL_HOOK\n\tif (unlikely(ksu_input_hook)) ksu_handle_input_handle_event(\&type, \&code, \&value);\n#endif\n\tif (is_event_supported(type, dev->evbit, EV_MAX))/g' drivers/input/input.c
            fi
            rm -f ksu_input.patch
          fi

          # ==========================================
          # 5. kernel/sys.c Hooking (4.17- setresuid)
          # ==========================================
          if [ -f "kernel/sys.c" ]; then
            echo "--- Patching kernel/sys.c ---"
            rm -f ksu_sys.patch
            echo '--- a/kernel/sys.c' >> ksu_sys.patch
            echo '+++ b/kernel/sys.c' >> ksu_sys.patch
            echo '@@ -1,3 +1,6 @@' >> ksu_sys.patch
            echo ' #include <linux/export.h>' >> ksu_sys.patch
            echo '+#ifdef CONFIG_KSU_MANUAL_HOOK' >> ksu_sys.patch
            echo '+extern int ksu_handle_setresuid(uid_t ruid, uid_t euid, uid_t suid);' >> ksu_sys.patch
            echo ' +#endif' >> ksu_sys.patch
            echo '@@ -848,3 +851,6 @@ SYSCALL_DEFINE3(setresuid, uid_t, ruid, uid_t, euid, uid_t, suid)' >> ksu_sys.patch
            echo '        int retval;' >> ksu_sys.patch
            echo '        kuid_t kruid, keuid, ksuid;' >> ksu_sys.patch
            echo ' ' >> ksu_sys.patch
            echo '+#ifdef CONFIG_KSU_MANUAL_HOOK' >> ksu_sys.patch
            echo '+       (void)ksu_handle_setresuid(ruid, euid, suid);' >> ksu_sys.patch
            echo '+#endif' >> ksu_sys.patch
            echo '        kruid = make_kuid(ns, ruid);' >> ksu_sys.patch

            if ! patch -p1 < ksu_sys.patch; then
              echo "Fallback sed for kernel/sys.c"
              sed -i '1i #ifdef CONFIG_KSU_MANUAL_HOOK\nextern int ksu_handle_setresuid(uid_t ruid, uid_t euid, uid_t suid);\n#endif' kernel/sys.c
              sed -i 's/kruid = make_kuid(ns, ruid);/#ifdef CONFIG_KSU_MANUAL_HOOK\n\t(void)ksu_handle_setresuid(ruid, euid, suid);\n#endif\n\tkruid = make_kuid(ns, ruid);/g' kernel/sys.c
            fi
            rm -f ksu_sys.patch
          fi

          # ==========================================
          # 6. fs/read_write.c Hooking (4.19- read)
          # ==========================================
          if [ -f "fs/read_write.c" ]; then
            echo "--- Patching fs/read_write.c ---"
            rm -f ksu_rw.patch
            echo '--- a/fs/read_write.c' >> ksu_rw.patch
            echo '+++ b/fs/read_write.c' >> ksu_rw.patch
            echo '@@ -1,3 +1,7 @@' >> ksu_rw.patch
            echo ' #include <linux/slab.h>' >> ksu_rw.patch
            echo '+#ifdef CONFIG_KSU_MANUAL_HOOK' >> ksu_rw.patch
            echo '+extern bool ksu_init_rc_hook __read_mostly;' >> ksu_rw.patch
            echo '+extern __attribute__((cold)) int ksu_handle_sys_read(unsigned int fd, char __user **buf_ptr, size_t *count_ptr);' >> ksu_rw.patch
            echo ' +#endif' >> ksu_rw.patch
            echo '@@ -568,3 +572,6 @@ SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)' >> ksu_rw.patch
            echo ' 	struct fd f = fdget_pos(fd);' >> ksu_rw.patch
            echo ' 	ssize_t ret = -EBADF;' >> ksu_rw.patch
            echo ' ' >> ksu_rw.patch
            echo '+#ifdef CONFIG_KSU_MANUAL_HOOK' >> ksu_rw.patch
            echo '+	if (unlikely(ksu_init_rc_hook)) ksu_handle_sys_read(fd, &buf, &count);' >> ksu_rw.patch
            echo '+#endif' >> ksu_rw.patch
            echo ' 	if (f.file) {' >> ksu_rw.patch

            if ! patch -p1 < ksu_rw.patch; then
              echo "Fallback sed for fs/read_write.c"
              sed -i '1i #ifdef CONFIG_KSU_MANUAL_HOOK\nextern bool ksu_init_rc_hook __read_mostly;\nextern __attribute__((cold)) int ksu_handle_sys_read(unsigned int fd, char __user **buf_ptr, size_t *count_ptr);\n#endif' fs/read_write.c
              sed -i 's/if (f.file)/#ifdef CONFIG_KSU_MANUAL_HOOK\n\tif (unlikely(ksu_init_rc_hook)) ksu_handle_sys_read(fd, \&buf, \&count);\n#endif\n\tif (f.file)/g' fs/read_write.c
            fi
            rm -f ksu_rw.patch
          fi

          # ==========================================
          # 7. fs/exec.c Hooking (上一步核对成功的核心提权桩点)
          # ==========================================
          if [ -f "fs/exec.c" ]; then
            echo "--- Patching fs/exec.c ---"
            sed -i '1i #ifdef CONFIG_KSU_MANUAL_HOOK\n#include <linux/binfmts.h>\n__attribute__((hot)) extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n#endif' fs/exec.c
            
            rm -f fs_exec_official.patch
            echo '--- a/fs/exec.c' >> fs_exec_official.patch
            echo '+++ b/fs/exec.c' >> fs_exec_official.patch
            echo '@@ -20,4 +20,7 @@ int do_execve(struct filename *filename,' >> fs_exec_official.patch
            echo ' 	struct user_arg_ptr argv = { .ptr.native = __argv };' >> fs_exec_official.patch
            echo ' 	struct user_arg_ptr envp = { .ptr.native = __envp };' >> fs_exec_official.patch
            echo '+#ifdef CONFIG_KSU_MANUAL_HOOK' >> fs_exec_official.patch
            echo '+	ksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);' >> fs_exec_official.patch
            echo '+#endif' >> fs_exec_official.patch
            echo ' 	return do_execveat_common(AT_FDCWD, filename, argv, envp, 0);' >> fs_exec_official.patch
            echo ' }' >> fs_exec_official.patch
            echo '@@ -30,4 +33,7 @@ static int compat_do_execve(struct filename *filename,' >> fs_exec_official.patch
            echo ' 		.is_compat = true,' >> fs_exec_official.patch
            echo ' 		.ptr.compat = __envp,' >> fs_exec_official.patch
            echo ' 	};' >> fs_exec_official.patch
            echo '+#ifdef CONFIG_KSU_MANUAL_HOOK' >> fs_exec_official.patch
            echo '+	ksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);' >> fs_exec_official.patch
            echo '+#endif' >> fs_exec_official.patch
            echo ' 	return do_execveat_common(AT_FDCWD, filename, argv, envp, 0);' >> fs_exec_official.patch
            echo ' }' >> fs_exec_official.patch

            if ! patch -p1 < fs_exec_official.patch; then
              echo "Fallback sed for fs/exec.c"
              sed -i '/int do_execve(struct filename \*filename,/,/return do_execveat_common(AT_FDCWD, filename, argv, envp, 0);/{
                /return do_execveat_common/i #ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_execveat((int *)AT_FDCWD, \&filename, \&argv, \&envp, 0);\n#endif
              }' fs/exec.c
              sed -i '/static int compat_do_execve(struct filename \*filename,/,/return do_execveat_common(AT_FDCWD, filename, argv, envp, 0);/{
                /return do_execveat_common/i #ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_execveat((int *)AT_FDCWD, \&filename, \&argv, \&envp, 0);\n#endif
              }' fs/exec.c
            fi
            rm -f fs_exec_official.patch
          fi

      - name: "PHASE 3.5: Advanced Patch Integration (Baseband-guard & ReKernel)"
        run: |
          cd $GITHUB_WORKSPACE
          TARGET_CONFIG="arch/arm64/configs/crux_defconfig"

          if [ ! -f "$TARGET_CONFIG" ]; then
            echo "❌ ERROR: $TARGET_CONFIG not found!" && exit 1
          fi

          echo "====================================================================="
          echo " 🛡️  STEP 1: PATCHING BASEBAND GUARD (FORCE 4.14 NONGKI LEGACY PATH)"
          echo "====================================================================="

          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
         
          echo "CONFIG_BBG=y" >> "$TARGET_CONFIG"
          if grep -q "config LSM" security/Kconfig; then
            sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
          fi

          echo "====================================================================="
          echo " ⚡ STEP 2: PATCHING REKERNEL FULL SYSTEM CORE (AWK-BASE64 METHOD)"
          echo "====================================================================="
          mkdir -p drivers/rekernel
          curl -fsSL "https://raw.githubusercontent.com/Sakion-Team/Re-Kernel/main/Integrate/rekernel/rekernel.c" -o drivers/rekernel/rekernel.c
          curl -fsSL "https://raw.githubusercontent.com/Sakion-Team/Re-Kernel/main/Integrate/rekernel/rekernel.h" -o drivers/rekernel/rekernel.h
          curl -fsSL "https://raw.githubusercontent.com/Sakion-Team/Re-Kernel/main/Integrate/rekernel/Kconfig" -o drivers/rekernel/Kconfig
          curl -fsSL "https://raw.githubusercontent.com/Sakion-Team/Re-Kernel/main/Integrate/rekernel/Makefile" -o drivers/rekernel/Makefile

          if [ -f "drivers/rekernel/rekernel.h" ]; then
            sed -i 's/frozen_task_group/rekernel_frozen_task_group/g' drivers/rekernel/rekernel.h
            sed -i 's/frozen_task_group/rekernel_frozen_task_group/g' drivers/rekernel/rekernel.c
          fi

          if ! grep -q "rekernel" drivers/Kconfig; then
            sed -i '/endmenu/i\\nsource "drivers/rekernel/Kconfig"' drivers/Kconfig
          fi
          if ! grep -q "rekernel" drivers/Makefile; then
            sed -i '$a\obj-$(CONFIG_REKERNEL) += rekernel/' drivers/Makefile
          fi

          if [ -f "drivers/android/binder.c" ] && ! grep -q "CONFIG_REKERNEL" drivers/android/binder.c; then
            sed -i '/#include <uapi\/linux\/android\/binder.h>/i\#ifdef CONFIG_REKERNEL\n#include <../rekernel/rekernel.h>\n#endif /* CONFIG_REKERNEL */' drivers/android/binder.c
            BINDER_FUNC_BASE64=""
            echo "$BINDER_FUNC_BASE64" | base64 -d > rekernel_binder_func.tmp
            awk 'NR==FNR {a[NR]=$0; next} /static void binder_transaction\(struct binder_proc \*proc,/ {for (i=1; i<=FNR; i++) if (i in a) print a[i]; print ""} {print}' rekernel_binder_func.tmp drivers/android/binder.c > drivers/android/binder.c.new
            mv drivers/android/binder.c.new drivers/android/binder.c
            rm -f rekernel_binder_func.tmp
            sed -i '/t->complete = 1;/i\#ifdef CONFIG_REKERNEL\n\trekernel_binder_transaction(reply, t, target_node, tr);\n#endif /* CONFIG_REKERNEL */' drivers/android/binder.c
          fi

          if [ -f "kernel/signal.c" ] && ! grep -q "CONFIG_REKERNEL" kernel/signal.c; then
            sed -i '/#include <trace\/events\/signal.h>/i\#ifdef CONFIG_REKERNEL\n#include <uapi/asm/signal.h>\n#include <../drivers/rekernel/rekernel.h>\n#endif /* CONFIG_REKERNEL */' kernel/signal.c
            sed -i '/int ret = -ESRCH;/a\#ifdef CONFIG_REKERNEL\n\tif (sig == SIGKILL || sig == SIGTERM || sig == SIGABRT || sig == SIGQUIT) rekernel_report(SIGNAL, sig, task_tgid_nr(current), current, task_tgid_nr(p), p, false, NULL);\n#endif /* CONFIG_REKERNEL */' kernel/signal.c
          fi

          echo "CONFIG_REKERNEL=y" >> "$TARGET_CONFIG"

      - name: "PHASE 3.7: Integrate Droidspaces & Docker Container Infrastructure"
        run: |
          cd $GITHUB_WORKSPACE
          TARGET_CONFIG="arch/arm64/configs/crux_defconfig"

          echo "====================================================================="
          echo " 🐳 STEP 1: FETCHING & INJECTING DROIDSPACES CONFIG"
          echo "====================================================================="
          curl -fsSL "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/Droidspaces/droidspaces.config" -o droidspaces.config
          if [ -f "droidspaces.config" ]; then
            cat droidspaces.config >> "$TARGET_CONFIG"
            rm -f droidspaces.config
          else
            echo "❌ ERROR: Failed to download droidspaces.config!" && exit 1
          fi

          sed -i 's/CONFIG_ANDROID_PARANOID_NETWORK=y/CONFIG_ANDROID_PARANOID_NETWORK=n/g' "$TARGET_CONFIG"
          echo "CONFIG_ANDROID_PARANOID_NETWORK=n" >> "$TARGET_CONFIG"

          echo "====================================================================="
          echo " 🧬 STEP 2: DOWNLOADING COCCINELLE SEMANTIC PATCHES"
          echo "====================================================================="
          curl -fsSL "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/Droidspaces/fix_kernel_panic_in_xt_qtaguid.cocci" -o fix_kernel_panic_in_xt_qtaguid.cocci
          curl -fsSL "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/Droidspaces/fix_restore_cgroup_file_prefix_handling.cocci" -o fix_restore_cgroup_file_prefix_handling.cocci

          echo "====================================================================="
          echo " 🛠️  STEP 3: RUNNING SPATCH SEMANTIC INJECTIONS"
          echo "====================================================================="
          if [ -f "net/netfilter/xt_qtaguid.c" ] && [ -f "fix_kernel_panic_in_xt_qtaguid.cocci" ]; then
            spatch --sp-file fix_kernel_panic_in_xt_qtaguid.cocci --in-place net/netfilter/xt_qtaguid.c
          fi

          key_file=""
          if [ -f "kernel/cgroup/cgroup.c" ]; then key_file="kernel/cgroup/cgroup.c";
          elif [ -f "kernel/cgroup.c" ]; then key_file="kernel/cgroup.c"; fi

          if [ -n "$key_file" ] && [ -f "fix_restore_cgroup_file_prefix_handling.cocci" ]; then
            if ! grep -q "kernfs_create_link" "$key_file"; then
              spatch --sp-file fix_restore_cgroup_file_prefix_handling.cocci --in-place "$key_file"
            fi
          else
            echo "❌ CRITICAL ERROR: Could not find cgroup.c core logic." && exit 1
          fi
          rm -f fix_kernel_panic_in_xt_qtaguid.cocci fix_restore_cgroup_file_prefix_handling.cocci

          echo "====================================================================="
          echo " 🩹 STEP 4: HOTFIXING NETPRIO CGROUP OLD-KERNEL ID CONFLICT"
          echo "====================================================================="
          NETPRIO_HEADER="include/net/netprio_cgroup.h"
          NETPRIO_SOURCE="net/core/netprio_cgroup.c"

          if [ -f "$NETPRIO_HEADER" ]; then sed -i 's/idx = css->cgroup->id;/idx = cgroup_id(css->cgroup);/g' "$NETPRIO_HEADER"; fi
          if [ -f "$NETPRIO_SOURCE" ]; then sed -i 's/css->cgroup->id/cgroup_id(css->cgroup)/g' "$NETPRIO_SOURCE"; fi

      - name: Start Kernel Compilation
        run: |
          cd $GITHUB_WORKSPACE
          if [ -d "$GITHUB_WORKSPACE/toolchain/zyc-clang/bin" ]; then
            REAL_CLANG_PATH="$GITHUB_WORKSPACE/toolchain/zyc-clang/bin"
          else
            REAL_CLANG_PATH="$GITHUB_WORKSPACE/toolchain/zyc-clang"
          fi
          export PATH=$REAL_CLANG_PATH:$PATH

          make O=out ARCH=arm64 crux_defconfig
          
          # 【指南全套注入】根据你提供的片段切换为手动桩点参数，显式去除默认 KSU 避免冲突
          ./scripts/config --file out/.config \
              -e KSU \
              -e KSU_MANUAL_HOOK \
              -e KSU_MANUAL_HOOK_AUTO_INPUT_HOOK \
              -e KSU_MANUAL_HOOK_AUTO_SETUID_HOOK \
              -e KSU_MANUAL_HOOK_AUTO_INITRC_HOOK \
              -e THREAD_INFO_IN_TASK \
              -e KSU_MULTI_MANAGER_SUPPORT \
              -e BUILD_ARM64_DT_OVERLAY

          make O=out ARCH=arm64 silentoldconfig

          make -j$(nproc --all) \
                      ARCH=arm64 \
                      SUBARCH=arm64 \
                      O=out \
                      CC=clang \
                      HOSTCC=clang \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
                      LD=ld.lld \
                      AR=llvm-ar \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip
                      
      - name: Pack Kernel with AnyKernel3 (Dual Output with DTBO)
        run: |
          cd $GITHUB_WORKSPACE
          BUILD_DATE=$(date -d "+8 hours" +%Y%m%d_%H%M)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          
          ZIP_FULL="crux-kernel-resukisu-manual-${BUILD_DATE}-${SHORT_SHA}-With-DTB.zip"
          ZIP_NODTB="crux-kernel-resukisu-manual-${BUILD_DATE}-${SHORT_SHA}-No-DTB.zip"
          
          echo "FINAL_ZIP_NAME=${ZIP_FULL}" >> $GITHUB_ENV
          echo "NO_DTB_ZIP_NAME=${ZIP_NODTB}" >> $GITHUB_ENV
          
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3_with_dtb
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3_no_dtb
          
          rm -rf ak3_with_dtb/.git ak3_with_dtb/README.md ak3_with_dtb/Image* ak3_with_dtb/zImage*
          rm -rf ak3_no_dtb/.git ak3_no_dtb/README.md ak3_no_dtb/Image* ak3_no_dtb/zImage*
          
          define_properties() {
            local target_script="$1"
            local track_mode="$2"
            echo '# AnyKernel3 Ramdisk Mod Script' > "$target_script"
            echo 'properties() { ' >> "$target_script"
            echo "kernel.string=Mi9Pro crux ReSukiSU Manual - ${track_mode} - ${BUILD_DATE}" >> "$target_script"
            echo 'do.devicecheck=1; do.modules=0; do.systemless=1; do.cleanup=1; do.cleanuponabort=1;' >> "$target_script"
            echo "device.name1=crux" >> "$target_script"
            echo '} ' >> "$target_script"
            echo 'BLOCK=boot; IS_SLOT_DEVICE=0; RAMDISK_COMPRESSION=auto; PATCH_VBMETA_FLAG=auto;' >> "$target_script"
            echo '. /tmp/anykernel/tools/ak3-core.sh;' >> "$target_script"
            echo 'split_boot;' >> "$target_script"
            echo 'flash_boot;' >> "$target_script"
            if [ "$track_mode" = "With-DTB" ]; then
              if [ -f "out/arch/arm64/boot/dtbo.img" ]; then echo 'flash_dtbo;' >> "$target_script"; fi
            fi
          }
          
          define_properties "ak3_with_dtb/anykernel.sh" "With-DTB"
          define_properties "ak3_no_dtb/anykernel.sh" "No-DTB"

          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then cp out/arch/arm64/boot/Image.gz-dtb ak3_with_dtb/Image.gz-dtb; else exit 1; fi
          if [ -f "out/arch/arm64/boot/dtbo.img" ]; then cp out/arch/arm64/boot/dtbo.img ak3_with_dtb/dtbo.img; fi

          if [ -f "out/arch/arm64/boot/Image" ]; then gzip -c out/arch/arm64/boot/Image > ak3_no_dtb/Image.gz; else exit 1; fi

          cd ak3_with_dtb && zip -r ../${ZIP_FULL} * && cd ..
          cd ak3_no_dtb && zip -r ../${ZIP_NODTB} * && cd ..

      - name: Upload Both Kernel Zips
        uses: actions/upload-artifact@v4
        with:
          name: crux-compiled-kernels
          path: |
            ${{ env.FINAL_ZIP_NAME }}
            ${{ env.NO_DTB_ZIP_NAME }}
