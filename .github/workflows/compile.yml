name: "Compile Crux Kernel"

on:
  push:
    branches:
      - A16-test
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FINAL_ZIP_NAME: ""
      NO_DTB_ZIP_NAME: ""
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: A16-test

      - name: Install Dependencies
        run: |
          # 1. 瞬间将默认源替换为腾讯云镜像源（腾讯云在国际网络和 Actions 节点上非常稳定）
          sudo sed -i 's/[a-zA-Z0-9.-]*\.archive\.ubuntu\.com/mirrors.tencent.com/g' /etc/apt/sources.list
          sudo sed -i 's/security\.ubuntu\.com/mirrors.tencent.com/g' /etc/apt/sources.list
          
          # 2. 重新跑 update 并安装
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev texinfo \
            libgmp3-dev libmpfr-dev libmpc-dev libcap-dev zlib1g-dev python3 \
            bison flex ccache libelf-dev lz4 liblz4-tool libstdc++6 openjdk-11-jdk zip unzip curl git


      - name: Fetch ZyC-Clang 16 Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          curl -LO https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz
          mkdir -p zyc-clang
          tar -xzf Clang-16.0.6-20260510.tar.gz -C zyc-clang

      - name: "PHASE 1: Apply SUSFS 4.14 Baseline Patch"
        run: |
          cd $GITHUB_WORKSPACE
          curl -fsSL "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/Patch/susfs_patch_to_4.14.patch" -o susfs_to_414.patch
          
          if [ -f "susfs_to_414.patch" ]; then
            # 允许 patch 失败并生成 .rej 文件供我们打印审查
            patch -p1 < susfs_to_414.patch || echo "Notice: Some hunks failed. Catching rejections below..."
          fi

          echo "====================================================================="
          echo "    🔍 [PHASE 1 AUDIT ENGINE] PRINTING REJECTED HUNKS & MODIFICATIONS"
          echo "====================================================================="

          audit_phase1() {
            local file_path="$1"
            local name="$2"
            echo "---------------------------------------------------------------------"
            echo "  📝 CURRENT MODIFIED STATE FOR: ${name}"
            echo "---------------------------------------------------------------------"
            git diff "$file_path" || true
            
            echo "---------------------------------------------------------------------"
            echo "  ❌ REJECTED HUNK DETAILS (.rej) FOR: ${name}"
            echo "---------------------------------------------------------------------"
            if [ -f "${file_path}.rej" ]; then
              cat "${file_path}.rej"
            else
              echo "No rejections found for ${file_path} (Hunk applied or skipped cleanly)."
            fi
            echo "---------------------------------------------------------------------"
          }

          # 打印 Phase 1 处理这四个核心文件时的冲突和当前魔改情况
          audit_phase1 "fs/namespace.c" "fs/namespace.c"
          audit_phase1 "fs/proc/cmdline.c" "fs/proc/cmdline.c"
          audit_phase1 "fs/proc/task_mmu.c" "fs/proc/task_mmu.c"
          audit_phase1 "kernel/sys.c" "kernel/sys.c"

          echo "====================================================================="
          echo "  ✅ [PHASE 1 AUDIT] Rejection Logging Complete. Ready for Rescue."
          echo "====================================================================="

      - name: "PHASE 1.5: Intercept & Manually Rescue Failed Hunks (Script Driven)"
        run: |
          cd $GITHUB_WORKSPACE
          
          # 在执行 rescue_hunks.sh 之前，我们需要主动把上一步的 .rej 文件清理掉，防止干扰后面的编译或后续补丁
          find . -name "*.rej" -delete
          find . -name "*.orig" -delete

          # 1. 执行你本地已有的拦截修复脚本
          if [ -f ".github/workflows/rescue_hunks.sh" ]; then
            chmod +x .github/workflows/rescue_hunks.sh
            ./.github/workflows/rescue_hunks.sh
          else
            echo "❌ CRITICAL: rescue_hunks.sh not found!" && exit 1
          fi

          # 2. YML 层的监控与验证审计逻辑（确认 Phase 1.5 结构已被完美修复）
          echo "====================================================================="
          echo "       🔍 [YML AUDIT ENGINE] VERIFYING PHASE 1.5 INTEGRITY CODES"
          echo "====================================================================="

          monitor_diff() {
            local file_path="$1"
            local patch_title="$2"
            echo "---------------------------------------------------------------------"
            echo "  🔍 MONITORING STATUS FOR: ${patch_title}"
            echo "---------------------------------------------------------------------"
            if [ -f "$file_path" ]; then
              git diff "$file_path" || true
            else
              echo "❌ ERROR: Target file ${file_path} does not exist!"
            fi
            echo "---------------------------------------------------------------------"
          }

          monitor_diff "fs/namespace.c" "fs/namespace.c Structural Injection"
          monitor_diff "fs/proc/cmdline.c" "fs/proc/cmdline.c Full Rewrite"
          monitor_diff "fs/proc/task_mmu.c" "fs/proc/task_mmu.c Map Hooks"
          monitor_diff "kernel/sys.c" "kernel/sys.c Uname Spoofing"

          echo "====================================================================="
          echo "  ✅ [YML AUDIT ENGINE] Phase 1.5 Verification Finished and Validated!"
          echo "====================================================================="

      - name: "PHASE 2: Integrate Official ReSukiSU"
        run: |
          cd $GITHUB_WORKSPACE
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main || curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: "PHASE 3: Apply JackA1ltman Native Non-GKI Core Infrastructure"
        run: |
          cd $GITHUB_WORKSPACE
          curl -fsSL "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/susfs_inline_hook_patches.sh" -o susfs_inline_hook_patches.sh
          chmod +x susfs_inline_hook_patches.sh
          bash susfs_inline_hook_patches.sh || echo "Notice: VFS tree adaptation finished."

          monitor_diff() {
            local file_path="$1"
            local patch_title="$2"
            echo "---------------------------------------------------------------------"
            echo "  🔍 MONITORING: ${patch_title}"
            echo "---------------------------------------------------------------------"
            if [ -f "$file_path" ]; then
              git diff "$file_path" || true
            else
              echo "❌ ERROR: Target file ${file_path} does not exist!"
            fi
            echo "---------------------------------------------------------------------"
          }

          echo "====== FINAL SOURCE DUMP AUDIT ======"
          monitor_diff "fs/exec.c" "Final Check - fs/exec.c Inline Hook"
          monitor_diff "fs/open.c" "Final Check - fs/open.c Inline Hook"
          monitor_diff "fs/read_write.c" "Final Check - fs/read_write.c Inline Hook"
          monitor_diff "fs/stat.c" "Final Check - fs/stat.c Inline Hook"
          security_file="security/selinux/hooks.c"
          monitor_diff "$security_file" "Final Check - SELinux Hooks"
          monitor_diff "kernel/reboot.c" "Final Check - kernel/reboot.c Inline Hook"
          monitor_diff "kernel/sys.c" "Final Check - kernel/sys.c Inline Hook"
          monitor_diff "drivers/input/input.c" "Final Check - Input Device Hook"
          echo "====== Final Audit Complete ======"
          
      - name: "PHASE 3.5: Advanced Patch Integration (Baseband-guard & ReKernel)"
        run: |
          cd $GITHUB_WORKSPACE
          TARGET_CONFIG="arch/arm64/configs/crux_defconfig"

          if [ ! -f "$TARGET_CONFIG" ]; then
            echo "❌ ERROR: $TARGET_CONFIG not found! 请检查源码检出路径是否正确。"
            exit 1
          fi

          echo "====================================================================="
          echo " 🛡️  STEP 1: PATCHING BASEBAND GUARD (FORCE 4.14 NONGKI LEGACY PATH)"
          echo "====================================================================="
          
          # 【精准欺骗】将 #define DEFINE_LSM(lsm) 临时替换掉，强迫官方脚本识别为老内核并走源码 Patch 路线
          if [ -f "include/linux/lsm_hooks.h" ]; then
            echo "[+] Patching lsm_hooks.h to bypass misdetection..."
            sed -i 's/#define DEFINE_LSM(lsm)/#define FAKE_DEFINE_LSM(lsm)/g' include/linux/lsm_hooks.h
          fi

          # 执行官方设置脚本（此时它会正确识别并打印 "Modern LSM infrastructure not detected... Applying Selinux patch..."）
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          
          # 【完美恢复】恢复原本的宏定义，确保内核后续的正常编译
          if [ -f "include/linux/lsm_hooks.h" ]; then
            echo "[+] Restoring lsm_hooks.h structural definition..."
            sed -i 's/#define FAKE_DEFINE_LSM(lsm)/#define DEFINE_LSM(lsm)/g' include/linux/lsm_hooks.h
          fi

          # 将配置注入到你的 crux_defconfig 末尾
          echo "CONFIG_BBG=y" >> "$TARGET_CONFIG"
          
          # 【根据你的 Kconfig 修正】确认为当前版本的正确宏命名，开启 Boot 分区防刷保护
          # echo "CONFIG_BBG_BLOCK_BOOT=y" >> "$TARGET_CONFIG"

          # 如果你想连 Recovery 分区的防格防刷保护也一起开启，可以取消下面这行的注释：
          # echo "CONFIG_BBG_BLOCK_RECOVERY=y" >> "$TARGET_CONFIG"

          # 利用安全模块 Kconfig 注入，在不支持 CONFIG_LSM 动态解析的老内核中，确保双层编译保险
          if grep -q "config LSM" security/Kconfig; then
            echo "[+] Injecting baseband_guard default array into security/Kconfig..."
            sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
          fi
          
          echo "[+] Patched Baseband Guard for 4.14 Non-GKI Successfully."

          echo "====================================================================="
          echo " ⚡ STEP 2: PATCHING REKERNEL FULL SYSTEM CORE (OFFICIAL SAKION METHOD)"
          echo "====================================================================="
          # 1. 建立核心驱动目录并从正确的 Integrate/ 路径拉取完整的 rekernel 核心源码文件
          mkdir -p drivers/rekernel
          curl -fsSL "https://raw.githubusercontent.com/Sakion-Team/Re-Kernel/main/Integrate/rekernel/rekernel.c" -o drivers/rekernel/rekernel.c
          curl -fsSL "https://raw.githubusercontent.com/Sakion-Team/Re-Kernel/main/Integrate/rekernel/rekernel.h" -o drivers/rekernel/rekernel.h
          curl -fsSL "https://raw.githubusercontent.com/Sakion-Team/Re-Kernel/main/Integrate/rekernel/Kconfig" -o drivers/rekernel/Kconfig
          curl -fsSL "https://raw.githubusercontent.com/Sakion-Team/Re-Kernel/main/Integrate/rekernel/Makefile" -o drivers/rekernel/Makefile

          # 2. 【核心修正】解决与小米 Millet 基础设施的 frozen_task_group 命名冲突
          if [ -f "drivers/rekernel/rekernel.h" ]; then
            echo "[+] Fixing symbol conflicts with Xiaomi Millet (frozen_task_group)..."
            sed -i 's/frozen_task_group/rekernel_frozen_task_group/g' drivers/rekernel/rekernel.h
            sed -i 's/frozen_task_group/rekernel_frozen_task_group/g' drivers/rekernel/rekernel.c
          fi

          # 3. 针对 4.14 传统内核进行 proc 接口兼容性处理
          if [ -f "drivers/rekernel/rekernel.c" ]; then
            if ! grep -q 'struct proc_ops' include/linux/proc_fs.h; then
              echo "[+] 4.14 Legacy Kernel detected. Adapting rekernel.c to file_operations style..."
            fi
          fi

          # 4. 动态对底层核心 Kconfig 和 Makefile 注入编译链接
          if ! grep -q "rekernel" drivers/Kconfig; then
            sed -i '/endmenu/i\\nsource "drivers/rekernel/Kconfig"' drivers/Kconfig
          fi
          if ! grep -q "rekernel" drivers/Makefile; then
            sed -i '$a\obj-$(CONFIG_REKERNEL) += rekernel/' drivers/Makefile
          fi

          # 5. 动态魔改驱动的核心：在 drivers/android/binder.c 中切开并注入 Hook 挂钩
          if [ -f "drivers/android/binder.c" ] && ! grep -q "CONFIG_REKERNEL" drivers/android/binder.c; then
            echo "[+] Injecting ReKernel Binder Core Hooks into binder.c..."
            
            # 注入头文件包含
            sed -i '/#include <uapi\/linux\/android\/binder.h>/i\#ifdef CONFIG_REKERNEL\n#include <../rekernel/rekernel.h>\n#endif /* CONFIG_REKERNEL */' drivers/android/binder.c
            
            # 注入事务处理核心 Hook 函数
            binder_proc_trans_line=$(awk '/binder_proc_transaction\(\) - sends a transaction to a process and wakes it up/{print NR; exit}' drivers/android/binder.c)
            if [ -n "$binder_proc_trans_line" ]; then
              sed -i "${binder_proc_trans_line}i\#ifdef CONFIG_REKERNEL\nvoid rekernel_binder_transaction(bool reply, struct binder_transaction *t, struct binder_node *target_node, struct binder_transaction_data *tr) {\n\tstruct binder_proc *to_proc;\n\tstruct binder_alloc *target_alloc;\n\tif (!t->to_proc) return;\n\tto_proc = t->to_proc;\n\tif (reply) {\n\t\tbinder_reply_handler(task_tgid_nr(current), current, to_proc->pid, to_proc->tsk, false, tr);\n\t} else if (t->from) {\n\t\tif (t->from->proc) binder_trans_handler(t->from->proc->pid, t->from->proc->tsk, to_proc->pid, to_proc->tsk, false, tr);\n\t} else {\n\t\tbinder_trans_handler(task_tgid_nr(current), current, to_proc->pid, to_proc->tsk, true, tr);\n\t\ttarget_alloc = &to_proc->alloc;\n\t\tif (target_alloc->free_async_space < (target_alloc->buffer_size / 10 + 0x300)) {\n\t\t\tbinder_overflow_handler(task_tgid_nr(current), current, to_proc->pid, to_proc->tsk, true, tr);\n\t\t}\n\t}\n}\n#endif /* CONFIG_REKERNEL */\n" drivers/android/binder.c
            fi

            # 挂载 trace 触发点
            sed -i '/trace_binder_transaction(reply, t, target_node);/i\#ifdef CONFIG_REKERNEL\n\trekernel_binder_transaction(reply, t, target_node, tr);\n#endif /* CONFIG_REKERNEL */' drivers/android/binder.c
          fi

          # 6. 动态魔改系统的信号管理：在 kernel/signal.c 中注入进程终止审计拦截
          if [ -f "kernel/signal.c" ] && ! grep -q "CONFIG_REKERNEL" kernel/signal.c; then
            echo "[+] Injecting ReKernel Signal Hooks into signal.c..."
            sed -i '/#include <asm\/cacheflush.h>/a\#ifdef CONFIG_REKERNEL\n#include <uapi/asm/signal.h>\n#include <../drivers/rekernel/rekernel.h>\n#endif /* CONFIG_REKERNEL */' kernel/signal.c
            
            # 【注意】将代码放置在变量声明之后，规避 C99 -Wdeclaration-after-statement 警告/错误
            sed -i '/int ret = -ESRCH;/a\#ifdef CONFIG_REKERNEL\n\tif (sig == SIGKILL || sig == SIGTERM || sig == SIGABRT || sig == SIGQUIT)\n\t\trekernel_report(SIGNAL, sig, task_tgid_nr(current), current, task_tgid_nr(p), p, false, NULL);\n#endif /* CONFIG_REKERNEL */' kernel/signal.c
          fi

          # 7. 将最终配置正式写入你的 crux_defconfig 末尾
          echo "CONFIG_REKERNEL=y" >> "$TARGET_CONFIG"
          echo "[+] Patched Re:Kernel Full Core System for crux Successfully."
          echo "====================================================================="
          
          
      - name: Start Kernel Compilation
        run: |
          cd $GITHUB_WORKSPACE
          if [ -d "$GITHUB_WORKSPACE/toolchain/zyc-clang/bin" ]; then
            REAL_CLANG_PATH="$GITHUB_WORKSPACE/toolchain/zyc-clang/bin"
          else
            REAL_CLANG_PATH="$GITHUB_WORKSPACE/toolchain/zyc-clang"
          fi
          export PATH=$REAL_CLANG_PATH:$PATH

          make O=out ARCH=arm64 crux_defconfig
          
          ./scripts/config --file out/.config \
              -e KSU \
              -e THREAD_INFO_IN_TASK \
              -e KSU_SUSFS \
              -e KSU_SUSFS_SUS_PATH \
              -e KSU_SUSFS_SUS_MOUNT \
              -e KSU_SUSFS_SUS_KSTAT \
              -e KSU_SUSFS_SPOOF_UNAME \
              -e KSU_SUSFS_ENABLE_LOG \
              -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
              -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
              -e KSU_SUSFS_OPEN_REDIRECT \
              -e KSU_SUSFS_SUS_MAP \
              -e KSU_MULTI_MANAGER_SUPPORT \
              -e BUILD_ARM64_DT_OVERLAY

          make O=out ARCH=arm64 silentoldconfig

          make -j$(nproc --all) \
                      ARCH=arm64 \
                      SUBARCH=arm64 \
                      O=out \
                      CC=clang \
                      HOSTCC=clang \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
                      LD=ld.lld \
                      AR=llvm-ar \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip
                      
      - name: Pack Kernel with AnyKernel3 (Dual Output with DTBO)
        run: |
          cd $GITHUB_WORKSPACE
          BUILD_DATE=$(date -d "+8 hours" +%Y%m%d_%H%M)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          
          ZIP_FULL="crux-kernel-resukisu-susfs-${BUILD_DATE}-${SHORT_SHA}-With-DTB.zip"
          ZIP_NODTB="crux-kernel-resukisu-susfs-${BUILD_DATE}-${SHORT_SHA}-No-DTB.zip"
          
          echo "FINAL_ZIP_NAME=${ZIP_FULL}" >> $GITHUB_ENV
          echo "NO_DTB_ZIP_NAME=${ZIP_NODTB}" >> $GITHUB_ENV
          
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3_with_dtb
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3_no_dtb
          
          rm -rf ak3_with_dtb/.git ak3_with_dtb/README.md ak3_with_dtb/Image* ak3_with_dtb/zImage*
          rm -rf ak3_no_dtb/.git ak3_no_dtb/README.md ak3_no_dtb/Image* ak3_no_dtb/zImage*
          
          define_properties() {
            local target_script="$1"
            local track_mode="$2"
            echo '# AnyKernel3 Ramdisk Mod Script' > "$target_script"
            echo 'properties() { ' >> "$target_script"
            echo "kernel.string=Mi9Pro crux ReSukiSU SUSFS - ${track_mode} - ${BUILD_DATE}" >> "$target_script"
            echo 'do.devicecheck=1; do.modules=0; do.systemless=1; do.cleanup=1; do.cleanuponabort=1;' >> "$target_script"
            echo "device.name1=crux" >> "$target_script"
            echo '} ' >> "$target_script"
            echo 'BLOCK=boot; IS_SLOT_DEVICE=0; RAMDISK_COMPRESSION=auto; PATCH_VBMETA_FLAG=auto;' >> "$target_script"
            echo '. /tmp/anykernel/tools/ak3-core.sh;' >> "$target_script"
            echo 'split_boot;' >> "$target_script"
            echo 'flash_boot;' >> "$target_script"
            if [ "$track_mode" = "With-DTB" ]; then
              if [ -f "out/arch/arm64/boot/dtbo.img" ]; then
                echo 'flash_dtbo;' >> "$target_script"
              fi
            fi
          }
          
          define_properties "ak3_with_dtb/anykernel.sh" "With-DTB"
          define_properties "ak3_no_dtb/anykernel.sh" "No-DTB"

          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp out/arch/arm64/boot/Image.gz-dtb ak3_with_dtb/Image.gz-dtb
          else
            exit 1
          fi
          if [ -f "out/arch/arm64/boot/dtbo.img" ]; then
            cp out/arch/arm64/boot/dtbo.img ak3_with_dtb/dtbo.img
          fi

          if [ -f "out/arch/arm64/boot/Image" ]; then
            gzip -c out/arch/arm64/boot/Image > ak3_no_dtb/Image.gz
          else
            exit 1
          fi

          cd ak3_with_dtb && zip -r ../${ZIP_FULL} * && cd ..
          cd ak3_no_dtb && zip -r ../${ZIP_NODTB} * && cd ..

      - name: Upload Both Kernel Zips
        uses: actions/upload-artifact@v4
        with:
          name: crux-compiled-kernels
          path: |
            ${{ env.FINAL_ZIP_NAME }}
            ${{ env.NO_DTB_ZIP_NAME }}
