name: "Compile Crux Kernel"

on:
  push:
    branches:
      - A16-test
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FINAL_ZIP_NAME: ""
      NO_DTB_ZIP_NAME: ""
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: A16-test

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev texinfo \
            libgmp3-dev libmpfr-dev libmpc-dev libcap-dev zlib1g-dev python3 \
            bison flex ccache libelf-dev lz4 liblz4-tool libstdc++6 openjdk-11-jdk zip unzip curl git

      - name: Fetch ZyC-Clang 16 Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          curl -LO https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz
          mkdir -p zyc-clang
          tar -xzf Clang-16.0.6-20260510.tar.gz -C zyc-clang

      - name: "PHASE 1: Apply SUSFS 4.14 Baseline Patch"
        run: |
          cd $GITHUB_WORKSPACE
          curl -fsSL "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/Patch/susfs_patch_to_4.14.patch" -o susfs_to_414.patch
          if [ -f "susfs_to_414.patch" ]; then
            patch -p1 < susfs_to_414.patch || echo "Notice: Some hunks failed."
          fi

          echo "====== Scanning for PHASE 1 Patch Conflicts (.rej files) ======"
          REJ_FILES_P1=$(find . -name "*.rej")
          if [ -z "$REJ_FILES_P1" ]; then
            echo "[SUCCESS] PHASE 1 Baseline Patch integrated cleanly without conflicts."
          else
            echo "[CRITICAL] PHASE 1 Rejected patch fragments found! Dumping details..."
            for rej in $REJ_FILES_P1; do
              target_file="${rej%.rej}"
              
              echo "=================================================="
              echo "[FIRST-HAND PATCH DIFF] Original modified state for: ${target_file}"
              echo "=================================================="
              git diff "${target_file}" || true
              
              echo "--------------------------------------------------"
              echo "[CONFLICT TRACE - PHASE 1] File: ${target_file} rejected hunk details:"
              cat "$rej"
              echo "--------------------------------------------------"
              
              if [[ "$target_file" == *"kernel/reboot.c"* || "$target_file" == *"fs/stat.c"* || "$target_file" == *"kernel/sys.c"* ]]; then
                rm -f "$rej"
              fi
            done
          fi

      - name: "PHASE 1.5: Intercept & Manually Rescue Failed Hunks (Precision Audited)"
        run: |
          cd $GITHUB_WORKSPACE
          
          monitor_diff() {
            local file_path="$1"
            local patch_title="$2"
            echo "---------------------------------------------------------------------"
            echo "  🔍 MONITORING: ${patch_title}"
            echo "---------------------------------------------------------------------"
            if [ -f "$file_path" ]; then
              git diff "$file_path" || true
            else
              echo "❌ ERROR: Target file ${file_path} does not exist!"
            fi
            echo "---------------------------------------------------------------------"
          }

          # ---------------------------------------------------------------------
          # 1. 彻底修复 fs/namespace.c (解决 mnt_alloc_group_id 和断头 if 逻辑)
          # ---------------------------------------------------------------------
          if [ -f "fs/namespace.c" ]; then
            echo "🔧 [Fixing] fs/namespace.c..."
            git checkout fs/namespace.c 2>/dev/null || true
            
            sed -i '/int id = mnt->mnt_id;/a \\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n\tif (mnt->mnt.mnt_flags & VFSMOUNT_MNT_FLAGS_KSU_UNSHARED_MNT)\n\t\treturn;\n#endif' fs/namespace.c
            
            sed -i '/static int mnt_alloc_group_id(struct mount \*mnt)/a #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n\tif (susfs_is_current_ksu_domain()) {\n\t\tint res;\n\t\tif (!ida_pre_get(&mnt_group_ida, GFP_KERNEL))\n\t\t\treturn -ENOMEM;\n\t\tres = ida_get_new_above(&mnt_group_ida, DEFAULT_KSU_MNT_GROUP_ID, \&mnt->mnt_group_id);\n\t\tif (!res)\n\t\t\treturn 0;\n\t}\n#endif' fs/namespace.c

            if grep -q "mnt->mnt.mnt_flags &= ~(MNT_WRITE_HOLD|MNT_MARKED|MNT_INTERNAL);" fs/namespace.c; then
                sed -i '/mnt->mnt.mnt_flags &= ~(MNT_WRITE_HOLD|MNT_MARKED|MNT_INTERNAL);/a #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n\tif (unlikely(is_mnt_ksu_unshared))\n\t\tmnt->mnt.mnt_flags |= VFSMOUNT_MNT_FLAGS_KSU_UNSHARED_MNT;\n#endif' fs/namespace.c
            fi
          fi

          # ---------------------------------------------------------------------
          # 2. 精准修复 fs/proc/cmdline.c (采用纯 echo -e / printf 机制，干掉全部前导缩进)
          # ---------------------------------------------------------------------
          if [ -f "fs/proc/cmdline.c" ]; then
            echo "🔧 [Fixing] fs/proc/cmdline.c..."
            git checkout fs/proc/cmdline.c 2>/dev/null || true
            
            rm -f fs/proc/cmdline.c
            echo '#include <linux/fs.h>' >> fs/proc/cmdline.c
            echo '#include <linux/init.h>' >> fs/proc/cmdline.c
            echo '#include <linux/proc_fs.h>' >> fs/proc/cmdline.c
            echo '#include <linux/seq_file.h>' >> fs/proc/cmdline.c
            echo '' >> fs/proc/cmdline.c
            echo '#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG' >> fs/proc/cmdline.c
            echo 'extern struct static_key_false susfs_is_fake_cmdline_or_bootconfig_buffer_set;' >> fs/proc/cmdline.c
            echo 'extern void susfs_spoof_cmdline_or_bootconfig(struct seq_file *m);' >> fs/proc/cmdline.c
            echo '#endif' >> fs/proc/cmdline.c
            echo '' >> fs/proc/cmdline.c
            echo 'static int cmdline_proc_show(struct seq_file *m, void *v)' >> fs/proc/cmdline.c
            echo '{' >> fs/proc/cmdline.c
            echo '#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG' >> fs/proc/cmdline.c
            printf "\tif (static_branch_likely(&susfs_is_fake_cmdline_or_bootconfig_buffer_set)) {\n" >> fs/proc/cmdline.c
            printf "\t\tsusfs_spoof_cmdline_or_bootconfig(m);\n" >> fs/proc/cmdline.c
            printf "\t\tseq_printf(m, \"%%s\\\\n\");\n" >> fs/proc/cmdline.c
            printf "\t\treturn 0;\n" >> fs/proc/cmdline.c
            printf "\t}\n" >> fs/proc/cmdline.c
            echo '#endif' >> fs/proc/cmdline.c
            echo '#ifdef CONFIG_INITRAMFS_IGNORE_SKIP_FLAG' >> fs/proc/cmdline.c
            printf "\tseq_printf(m, \"%%s\\\\n\", proc_command_line);\n" >> fs/proc/cmdline.c
            echo '#else' >> fs/proc/cmdline.c
            printf "\tseq_printf(m, \"%%s\\\\n\", saved_command_line);\n" >> fs/proc/cmdline.c
            echo '#endif' >> fs/proc/cmdline.c
            printf "\treturn 0;\n" >> fs/proc/cmdline.c
            echo '}' >> fs/proc/cmdline.c
            echo '' >> fs/proc/cmdline.c
            echo 'static int cmdline_proc_open(struct inode *inode, struct file *file)' >> fs/proc/cmdline.c
            echo '{' >> fs/proc/cmdline.c
            printf "\treturn single_open(file, cmdline_proc_show, NULL);\n" >> fs/proc/cmdline.c
            echo '}' >> fs/proc/cmdline.c
            echo '' >> fs/proc/cmdline.c
            echo 'static const struct file_operations cmdline_proc_fops = {' >> fs/proc/cmdline.c
            printf "\t.open\t\t= cmdline_proc_open,\n" >> fs/proc/cmdline.c
            printf "\t.read\t\t= seq_read,\n" >> fs/proc/cmdline.c
            printf "\t.llseek\t\t= seq_lseek,\n" >> fs/proc/cmdline.c
            printf "\t.release\t= single_release,\n" >> fs/proc/cmdline.c
            echo '};' >> fs/proc/cmdline.c
            echo '' >> fs/proc/cmdline.c
            echo 'static int __init proc_cmdline_init(void)' >> fs/proc/cmdline.c
            echo '{' >> fs/proc/cmdline.c
            printf "\tproc_create(\"cmdline\", 0, NULL, &cmdline_proc_fops);\n" >> fs/proc/cmdline.c
            printf "\treturn 0;\n" >> fs/proc/cmdline.c
            echo '}' >> fs/proc/cmdline.c
            echo 'fs_initcall(proc_cmdline_init);' >> fs/proc/cmdline.c
          fi

          # ---------------------------------------------------------------------
          # 3. 完美重写 fs/proc/task_mmu.c (全面补正因厂商魔改导致的四大崩溃处)
          # ---------------------------------------------------------------------
          if [ -f "fs/proc/task_mmu.c" ]; then
            echo "🔧 [Fixing] fs/proc/task_mmu.c..."
            git checkout fs/proc/task_mmu.c 2>/dev/null || true

            sed -i '/#include <linux\/uaccess.h>/i #if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n#include <linux/susfs.h>\n#endif' fs/proc/task_mmu.c

            sed -i '/struct inode \*inode = file_inode(vma->vm_file);/a #ifdef CONFIG_KSU_SUSFS_SUS_MAP\n\t\tif (SUSFS_IS_INODE_SUS_MAP(inode))\n\t\t\treturn;\n#endif' fs/proc/task_mmu.c

            if grep -q "static int show_smap(struct seq_file \*m, void \*v)" fs/proc/task_mmu.c; then
                sed -i '/static int show_smap(struct seq_file \*m, void \*v)/,!b; /{/a #ifdef CONFIG_KSU_SUSFS_SUS_MAP\n\tstruct vm_area_struct *vma = v;\n\tif (vma && vma->vm_file && SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file)))\n\t\treturn 0;\n#endif' fs/proc/task_mmu.c
            fi

            sed -i '/down_read(&mm->mmap_sem);/a #ifdef CONFIG_KSU_SUSFS_SUS_MAP\n\t\tvma = find_vma(mm, start_vaddr);\n\t\tif (vma && vma->vm_file && SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file))) {\n\t\t\tup_read(&mm->mmap_sem);\n\t\t\tstart_vaddr = end;\n\t\t\tcontinue;\n\t\t}\n#endif' fs/proc/task_mmu.c

            if grep -q "static int show_numa_map(struct seq_file \*m, void \*v)" fs/proc/task_mmu.c; then
                sed -i '/static int show_numa_map(struct seq_file \*m, void \*v)/,!b; /{/a #ifdef CONFIG_KSU_SUSFS_SUS_MAP\n\tstruct vm_area_struct *vma = v;\n\tif (vma && vma->vm_file && SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file)))\n\t\treturn 0;\n#endif' fs/proc/task_mmu.c
            fi
          fi

          # ---------------------------------------------------------------------
          # 4. 精准修复 kernel/sys.c (阻断死锁防护，对新旧 uname 双重注入)
          # ---------------------------------------------------------------------
          if [ -f "kernel/sys.c" ]; then
            echo "🔧 [Fixing] kernel/sys.c..."
            git checkout kernel/sys.c 2>/dev/null || true
            
            sed -i '/SYSCALL_DEFINE1(newuname/i #ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\nextern struct static_key_false susfs_is_uname_spoof_buffer_set;\nextern void susfs_spoof_uname(struct new_utsname* tmp);\n#endif' kernel/sys.c
            sed -i '/memcpy(&tmp, utsname(), sizeof(tmp));/a #ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\n\tif (static_branch_likely(&susfs_is_uname_spoof_buffer_set))\n\t\tsusfs_spoof_uname(\&tmp);\n#endif' kernel/sys.c
            
            sed -i '/SYSCALL_DEFINE1(uname/i #ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\nextern struct static_key_false susfs_is_uname_spoof_buffer_set;\nextern void susfs_spoof_uname(struct new_utsname* tmp);\n#endif' kernel/sys.c
          fi

          find . -name "*.rej" -delete
          find . -name "*.orig" -delete

          echo "====== 验证 1.5 阶段 终极重构审计结果 ======"
          monitor_diff "fs/namespace.c" "fs/namespace.c Injection Status"
          monitor_diff "fs/proc/cmdline.c" "fs/proc/cmdline.c Injection Status"
          monitor_diff "fs/proc/task_mmu.c" "fs/proc/task_mmu.c Injection Status"
          monitor_diff "kernel/sys.c" "kernel/sys.c Injection Status"

      - name: "PHASE 2: Integrate Official ReSukiSU"
        run: |
          cd $GITHUB_WORKSPACE
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main || curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: "PHASE 3: Apply JackA1ltman Native Non-GKI Core Infrastructure"
        run: |
          cd $GITHUB_WORKSPACE
          curl -fsSL "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/susfs_inline_hook_patches.sh" -o susfs_inline_hook_patches.sh
          chmod +x susfs_inline_hook_patches.sh
          bash susfs_inline_hook_patches.sh || echo "Notice: VFS tree adaptation finished."

          monitor_diff() {
            local file_path="$1"
            local patch_title="$2"
            echo "---------------------------------------------------------------------"
            echo "  🔍 MONITORING: ${patch_title}"
            echo "---------------------------------------------------------------------"
            if [ -f "$file_path" ]; then
              git diff "$file_path" || true
            else
              echo "❌ ERROR: Target file ${file_path} does not exist!"
            fi
            echo "---------------------------------------------------------------------"
          }

          echo "====== FINAL SOURCE DUMP AUDIT ======"
          monitor_diff "fs/exec.c" "Final Check - fs/exec.c Inline Hook"
          monitor_diff "fs/open.c" "Final Check - fs/open.c Inline Hook"
          monitor_diff "fs/read_write.c" "Final Check - fs/read_write.c Inline Hook"
          monitor_diff "fs/stat.c" "Final Check - fs/stat.c Inline Hook"
          security_file="security/selinux/hooks.c"
          monitor_diff "$security_file" "Final Check - SELinux Hooks"
          monitor_diff "kernel/reboot.c" "Final Check - kernel/reboot.c Inline Hook"
          monitor_diff "kernel/sys.c" "Final Check - kernel/sys.c Inline Hook"
          monitor_diff "drivers/input/input.c" "Final Check - Input Device Hook"
          echo "====== Final Audit Complete ======"

      - name: Start Kernel Compilation
        run: |
          cd $GITHUB_WORKSPACE
          if [ -d "$GITHUB_WORKSPACE/toolchain/zyc-clang/bin" ]; then
            REAL_CLANG_PATH="$GITHUB_WORKSPACE/toolchain/zyc-clang/bin"
          else
            REAL_CLANG_PATH="$GITHUB_WORKSPACE/toolchain/zyc-clang"
          fi
          export PATH=$REAL_CLANG_PATH:$PATH

          make O=out ARCH=arm64 crux_defconfig
          
          ./scripts/config --file out/.config \
              -e KSU \
              -e THREAD_INFO_IN_TASK \
              -e KSU_SUSFS \
              -e KSU_SUSFS_SUS_PATH \
              -e KSU_SUSFS_SUS_MOUNT \
              -e KSU_SUSFS_SUS_KSTAT \
              -e KSU_SUSFS_SPOOF_UNAME \
              -e KSU_SUSFS_ENABLE_LOG \
              -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
              -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
              -e KSU_SUSFS_OPEN_REDIRECT \
              -e KSU_SUSFS_SUS_MAP \
              -e KSU_MULTI_MANAGER_SUPPORT \
              -e BUILD_ARM64_DT_OVERLAY

          make O=out ARCH=arm64 silentoldconfig

          make -j$(nproc --all) \
                      ARCH=arm64 \
                      SUBARCH=arm64 \
                      O=out \
                      CC=clang \
                      HOSTCC=clang \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
                      LD=ld.lld \
                      AR=llvm-ar \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip
                      
      - name: Pack Kernel with AnyKernel3 (Dual Output with DTBO)
        run: |
          cd $GITHUB_WORKSPACE
          BUILD_DATE=$(date -d "+8 hours" +%Y%m%d_%H%M)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          
          ZIP_FULL="crux-kernel-resukisu-susfs-${BUILD_DATE}-${SHORT_SHA}-With-DTB.zip"
          ZIP_NODTB="crux-kernel-resukisu-susfs-${BUILD_DATE}-${SHORT_SHA}-No-DTB.zip"
          
          echo "FINAL_ZIP_NAME=${ZIP_FULL}" >> $GITHUB_ENV
          echo "NO_DTB_ZIP_NAME=${ZIP_NODTB}" >> $GITHUB_ENV
          
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3_with_dtb
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3_no_dtb
          
          rm -rf ak3_with_dtb/.git ak3_with_dtb/README.md ak3_with_dtb/Image* ak3_with_dtb/zImage*
          rm -rf ak3_no_dtb/.git ak3_no_dtb/README.md ak3_no_dtb/Image* ak3_no_dtb/zImage*
          
          define_properties() {
            local target_script="$1"
            local track_mode="$2"
            echo '# AnyKernel3 Ramdisk Mod Script' > "$target_script"
            echo 'properties() { ' >> "$target_script"
            echo "kernel.string=Mi9Pro crux ReSukiSU SUSFS - ${track_mode} - ${BUILD_DATE}" >> "$target_script"
            echo 'do.devicecheck=1; do.modules=0; do.systemless=1; do.cleanup=1; do.cleanuponabort=1;' >> "$target_script"
            echo "device.name1=crux" >> "$target_script"
            echo '} ' >> "$target_script"
            echo 'BLOCK=boot; IS_SLOT_DEVICE=0; RAMDISK_COMPRESSION=auto; PATCH_VBMETA_FLAG=auto;' >> "$target_script"
            echo '. /tmp/anykernel/tools/ak3-core.sh;' >> "$target_script"
            echo 'split_boot;' >> "$target_script"
            echo 'flash_boot;' >> "$target_script"
            if [ "$track_mode" = "With-DTB" ]; then
              if [ -f "out/arch/arm64/boot/dtbo.img" ]; then
                echo 'flash_dtbo;' >> "$target_script"
              fi
            fi
          }
          
          define_properties "ak3_with_dtb/anykernel.sh" "With-DTB"
          define_properties "ak3_no_dtb/anykernel.sh" "No-DTB"

          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp out/arch/arm64/boot/Image.gz-dtb ak3_with_dtb/Image.gz-dtb
          else
            exit 1
          fi
          if [ -f "out/arch/arm64/boot/dtbo.img" ]; then
            cp out/arch/arm64/boot/dtbo.img ak3_with_dtb/dtbo.img
          fi

          if [ -f "out/arch/arm64/boot/Image" ]; then
            gzip -c out/arch/arm64/boot/Image > ak3_no_dtb/Image.gz
          else
            exit 1
          fi

          cd ak3_with_dtb && zip -r ../${ZIP_FULL} * && cd ..
          cd ak3_no_dtb && zip -r ../${ZIP_NODTB} * && cd ..

      - name: Upload Both Kernel Zips
        uses: actions/upload-artifact@v4
        with:
          name: crux-compiled-kernels
          path: |
            ${{ env.FINAL_ZIP_NAME }}
            ${{ env.NO_DTB_ZIP_NAME }}
