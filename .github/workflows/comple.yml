name: Compile Crux Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # 使用最新、无需排队的 GitHub Actions 服务器
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: test

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev texinfo \
            libgmp3-dev libmpfr-dev libmpc-dev libcap-dev zlib1g-dev python3 \
            bison flex ccache libelf-dev lz4 liblz4-tool libstdc++6 openjdk-11-jdk zip unzip curl git

      - name: Fetch ZyC-Clang 16 Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          
          # 下载你指定的最新版 ZyC-Clang 16 (2026-05-10 编译版)
          echo "Downloading latest ZyC-Clang 16..."
          curl -LO https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz
          mkdir -p zyc-clang
          tar -xzf Clang-16.0.6-20260510.tar.gz -C zyc-clang

      - name: Start Kernel Compilation
        run: |
          cd $GITHUB_WORKSPACE
          
          # 精准锁定新版 ZyC-Clang 的实际 bin 路径
          if [ -d "$GITHUB_WORKSPACE/toolchain/zyc-clang/bin" ]; then
            REAL_CLANG_PATH="$GITHUB_WORKSPACE/toolchain/zyc-clang/bin"
          else
            REAL_CLANG_PATH="$GITHUB_WORKSPACE/toolchain/zyc-clang"
          fi
          
          # 将 ZyC-Clang 路径推到 PATH 的最前端，让 command -v 完美通过
          export PATH=$REAL_CLANG_PATH:$PATH
          
          # 验证编译器是否成功就位
          if ! command -v clang >/dev/null 2>&1; then
            echo "ERROR: clang does not exist, please check your environment."
            exit 1
          fi
          
          # 1. 生成配置文件
          make O=out ARCH=arm64 crux_defconfig
          
          # 2. 完美的参数投喂（完全复刻你找到的优秀标准范例）
          echo "Starting make process with standard ZyC arguments..."
          make -j$(nproc --all) \
                      ARCH=arm64 \
                      SUBARCH=arm64 \
                      O=out \
                      CC=clang \
                      HOSTCC=clang \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
                      LD=ld.lld \
                      AR=llvm-ar \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip

      - name: Verify and Package Output
        run: |
          cd $GITHUB_WORKSPACE
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "Kernel compiled successfully!"
            mkdir -p output
            cp out/arch/arm64/boot/Image.gz-dtb output/
            find out/ -name "*.ko" -exec cp {} output/ \; 2>/dev/null || true
            cd output && zip -r ../crux-kernel-clean.zip *
          else
            echo "ERROR: Kernel image not found. Compilation might have failed."
            exit 1
          fi

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crux-kernel-clean
          path: crux-kernel-clean.zip
