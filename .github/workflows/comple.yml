name: Compile Crux Kernel (ReSukiSU & SUSFS 2.1 - Native Hook)

on:
  push:
    branches:
      - test
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: test

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev texinfo \
            libgmp3-dev libmpfr-dev libmpc-dev libcap-dev zlib1g-dev python3 \
            bison flex ccache libelf-dev lz4 liblz4-tool libstdc++6 openjdk-11-jdk zip unzip curl git

      - name: Fetch ZyC-Clang 16 Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          curl -LO https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz
          mkdir -p zyc-clang
          tar -xzf Clang-16.0.6-20260510.tar.gz -C zyc-clang

      - name: "STEP 1: Integrate ReSukiSU Environment"
        run: |
          cd $GITHUB_WORKSPACE
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main || curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: "STEP 2: Integrate SUSFS Baseline Patch"
        run: |
          cd $GITHUB_WORKSPACE
          curl -fsSL "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/Patch/susfs_patch_to_4.14.patch" -o susfs_to_414.patch
          patch -p1 < susfs_to_414.patch || echo "Patching finished."
         
          echo "=== 以下是补丁失败的详情，请查看这些 .rej 文件 ==="
          find . -name "*.rej" -exec cat {} \; > reject_details.txt
          cat reject_details.txt

      - name: "STEP 3: Execute Adaptation Scripts"
        run: |
          cd $GITHUB_WORKSPACE
          curl -fsSL "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/syscall_hook_patches.sh" -o syscall_hook_patches.sh
          chmod +x syscall_hook_patches.sh && bash syscall_hook_patches.sh
          curl -fsSL "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/susfs_inline_hook_patches.sh" -o susfs_inline_hook_patches.sh
          chmod +x susfs_inline_hook_patches.sh && bash susfs_inline_hook_patches.sh

      - name: "STEP 2: Precision Surgery (Complete Implementation)"
        run: |
          python3 - <<EOF
          import os

          def replace_block(file_path, old_text, new_text):
              if not os.path.exists(file_path): return
              with open(file_path, 'r') as f: content = f.read()
              if new_text in content: return
              if old_text in content:
                  with open(file_path, 'w') as f: f.write(content.replace(old_text, new_text))
                  print(f"[+] Patched {file_path}")

          # 1. kernel/sys.c: newuname 注入
          replace_block('kernel/sys.c', 
              'down_read(&uts_sem);\n\tmemcpy(&tmp, utsname(), sizeof(tmp));',
              'down_read(&uts_sem);\n\tmemcpy(&tmp, utsname(), sizeof(tmp));\n#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\n\tif (static_branch_likely(&susfs_is_uname_spoof_buffer_set))\n\t\tsusfs_spoof_uname(&tmp);\n#endif')

          # 2. fs/namespace.c: mnt_alloc_group_id 逻辑替换
          # 这是最复杂的挂载点，必须完全替换原有的 id 分配逻辑
          with open('fs/namespace.c', 'r') as f: content = f.read()
          old_code = 'res = ida_get_new_above(&mnt_group_ida,\n\t\t\tmnt_group_start,\n\t\t\t&mnt->mnt_group_id);'
          new_code = '''
          #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          	if (susfs_is_current_ksu_domain()) {
          		if (!ida_pre_get(&mnt_group_ida, GFP_KERNEL)) return -ENOMEM;
          		res = ida_get_new_above(&mnt_group_ida, DEFAULT_KSU_MNT_GROUP_ID, &mnt->mnt_group_id);
          		goto bypass_orig_flow;
          	}
          	if (!ida_pre_get(&mnt_group_ida, GFP_KERNEL)) return -ENOMEM;
          	res = ida_get_new_above(&mnt_group_ida, mnt_group_start, &mnt->mnt_group_id);
          bypass_orig_flow:
          #else
          	if (!ida_pre_get(&mnt_group_ida, GFP_KERNEL)) return -ENOMEM;
          	res = ida_get_new_above(&mnt_group_ida, mnt_group_start, &mnt->mnt_group_id);
          #endif'''
          if 'bypass_orig_flow' not in content:
              with open('fs/namespace.c', 'w') as f: f.write(content.replace(old_code, new_code))

          # 3. fs/proc/cmdline.c: Cmdline 注入
          replace_block('fs/proc/cmdline.c', 
              'static int cmdline_proc_show(struct seq_file *m, void *v)\n{',
              '#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\nextern struct static_key_false susfs_is_fake_cmdline_or_bootconfig_buffer_set;\nextern void susfs_spoof_cmdline_or_bootconfig(struct seq_file *m);\n#endif\nstatic int cmdline_proc_show(struct seq_file *m, void *v)\n{\n#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\n\tif (static_branch_likely(&susfs_is_fake_cmdline_or_bootconfig_buffer_set)) {\n\t\tsusfs_spoof_cmdline_or_bootconfig(m);\n\t\tseq_printf(m, "%s\\n");\n\t\treturn 0;\n\t}\n#endif')

          # 4. fs/proc/task_mmu.c: Smap 过滤逻辑
          # 补全失败的 Hunk #5, #6, #7
          with open('fs/proc/task_mmu.c', 'r') as f: content = f.read()
          if 'bypass_orig_flow' not in content:
              content = content.replace('if (!rollup_mode)', '#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n\tif (vma->vm_file && SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file))) return 0;\n#endif\n\tif (!rollup_mode)')
              content = content.replace('arch_show_smap(m, vma);\n\t\tshow_smap_vma_flags(m, vma);',
                  '#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n\tif (vma->vm_file && SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file))) goto bypass_orig_flow;\n#endif\n\t\tarch_show_smap(m, vma);\n\t\tshow_smap_vma_flags(m, vma);\n\t}\n\n#ifdef CONFIG_KSU_SUSFS_SUS_MAP\nbypass_orig_flow:\n#endif\n\tif (0) {')
              with open('fs/proc/task_mmu.c', 'w') as f: f.write(content)
          EOF
          
      - name: Start Kernel Compilation
        run: |
          cd $GITHUB_WORKSPACE
          export PATH=$GITHUB_WORKSPACE/toolchain/zyc-clang/bin:$PATH
          make O=out ARCH=arm64 crux_defconfig
          ./scripts/config --file out/.config -e KSU -e KSU_SUSFS -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT -e KSU_SUSFS_SUS_KSTAT -e KSU_SUSFS_SPOOF_UNAME -e KSU_SUSFS_ENABLE_LOG -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG -e KSU_SUSFS_OPEN_REDIRECT -e KSU_SUSFS_SUS_MAP -e KSU_MULTI_MANAGER_SUPPORT
          make O=out ARCH=arm64 silentoldconfig
          make -j$(nproc --all) ARCH=arm64 O=out CC=clang CROSS_COMPILE=aarch64-linux-gnu-

      - name: Pack Kernel with AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            BUILD_DATE=$(date -d "+8 hours" +%Y%m%d_%H%M)
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            ZIP_NAME="crux-kernel-resukisu-susfs-${BUILD_DATE}-${SHORT_SHA}.zip"
            echo "FINAL_ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
            rm -rf AnyKernel3/.git AnyKernel3/README.md AnyKernel3/Image* AnyKernel3/zImage*
            # 下面还原你原版的脚本构造逻辑
            echo '# AnyKernel3 Ramdisk Mod Script' > AnyKernel3/anykernel.sh
            echo '# osm0sis @ xda-developers' >> AnyKernel3/anykernel.sh
            echo 'properties() {' >> AnyKernel3/anykernel.sh
            echo "kernel.string=Crux ReSukiSU SUSFS 2.1 - ${BUILD_DATE} - ${SHORT_SHA} - by xmanweb" >> AnyKernel3/anykernel.sh
            echo 'do.devicecheck=1; do.modules=0; do.systemless=1; do.cleanup=1; do.cleanuponabort=1;' >> AnyKernel3/anykernel.sh
            echo 'device.name1=crux' >> AnyKernel3/anykernel.sh
            echo '} # end properties' >> AnyKernel3/anykernel.sh
            echo 'BLOCK=boot; IS_SLOT_DEVICE=0; RAMDISK_COMPRESSION=auto; PATCH_VBMETA_FLAG=auto;' >> AnyKernel3/anykernel.sh
            echo '. /tmp/anykernel/tools/ak3-core.sh; split_boot; flash_boot; flash_dtbo;' >> AnyKernel3/anykernel.sh
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
            cd AnyKernel3 && zip -r ../${ZIP_NAME} *
          else
            echo "ERROR: Kernel image not found." && exit 1
          fi

      - name: Upload Flashable Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: kernel-flashable-zip
          path: "*.zip"
