name: Compile Crux Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # 使用最新、无需排队的 GitHub Actions 服务器
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: test

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev texinfo \
            libgmp3-dev libmpfr-dev libmpc-dev libcap-dev zlib1g-dev python3 \
            bison flex ccache libelf-dev lz4 liblz4-tool libstdc++6 openjdk-11-jdk zip unzip curl git

      - name: Fetch ZyC-Clang 16 Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          
          # 下载最新版 ZyC-Clang 16 (2026-05-10 编译版)
          echo "Downloading latest ZyC-Clang 16..."
          curl -LO https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz
          mkdir -p zyc-clang
          tar -xzf Clang-16.0.6-20260510.tar.gz -C zyc-clang

      - name: Start Kernel Compilation
        run: |
          cd $GITHUB_WORKSPACE
          
          # 精准锁定新版 ZyC-Clang 的实际 bin 路径
          if [ -d "$GITHUB_WORKSPACE/toolchain/zyc-clang/bin" ]; then
            REAL_CLANG_PATH="$GITHUB_WORKSPACE/toolchain/zyc-clang/bin"
          else
            REAL_CLANG_PATH="$GITHUB_WORKSPACE/toolchain/zyc-clang"
          fi
          
          # 将 ZyC-Clang 路径推到 PATH 的最前端
          export PATH=$REAL_CLANG_PATH:$PATH
          
          # 1. 生成配置文件
          make O=out ARCH=arm64 crux_defconfig
          
          # 2. 完美的参数投喂开始编译
          echo "Starting make process with standard ZyC arguments..."
          make -j$(nproc --all) \
                      ARCH=arm64 \
                      SUBARCH=arm64 \
                      O=out \
                      CC=clang \
                      HOSTCC=clang \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
                      LD=ld.lld \
                      AR=llvm-ar \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip

      - name: Pack Kernel with AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "Kernel compiled successfully! Preparing AnyKernel3..."
            
            # 1. 克隆官方 AnyKernel3 模板
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
            
            # 2. 移除模板中自带的无用占位文件
            rm -rf AnyKernel3/.git AnyKernel3/README.md AnyKernel3/Image* AnyKernel3/zImage*
            
            # 3. 核心配置修改：配置 crux (小米9 Pro) 的设备参数
            # block 指向的是 crux 的 boot 分区路径 (/dev/block/bootdevice/by-name/boot)
            sed -i 's/kernel.string=./kernel.string=Crux Custom Kernel by xmanweb/g' AnyKernel3/anykernel.sh
            sed -i 's/device.name1=./device.name1=crux/g' AnyKernel3/anykernel.sh
            sed -i 's/device.name2=./device.name2=crux_pro/g' AnyKernel3/anykernel.sh
            sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;|block=/dev/block/bootdevice/by-name/boot;|g' AnyKernel3/anykernel.sh
            sed -i 's/is_slot_device=0;/is_slot_device=0;/g' AnyKernel3/anykernel.sh # crux 是非 A/B 分区设备
            
            # 4. 把刚刚编译出来的 Image.gz-dtb 复制进 AnyKernel3 根目录
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
            
            # 5. 自动收集并打包编译出来的内核模块 (*.ko)
            echo "Copying vendor modules..."
            find out/ -name "*.ko" -exec cp {} AnyKernel3/ \; 2>/dev/null || true
            
            # 6. 生成最终的第三方 Recovery 刷机包
            cd AnyKernel3
            zip -r ../crux-kernel-anykernel3.zip *
            cd ..
            echo "AnyKernel3 flashable zip created successfully!"
          else
            echo "ERROR: Kernel image not found. Compilation might have failed."
            exit 1
          fi

      - name: Upload Flashable Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: crux-kernel-flashable
          path: crux-kernel-anykernel3.zip
