name: Compile Crux Kernel (ReSukiSU & SUSFS 2.1)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: test

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev texinfo \
            libgmp3-dev libmpfr-dev libmpc-dev libcap-dev zlib1g-dev python3 \
            bison flex ccache libelf-dev lz4 liblz4-tool libstdc++6 openjdk-11-jdk zip unzip curl git

      - name: Fetch ZyC-Clang 16 Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          echo "Downloading latest ZyC-Clang 16..."
          curl -LO https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz
          mkdir -p zyc-clang
          tar -xzf Clang-16.0.6-20260510.tar.gz -C zyc-clang

      - name: Integrate Official ReSukiSU
        run: |
          cd $GITHUB_WORKSPACE
          echo "Integrating Official ReSukiSU..."
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main || curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: Integrate Simonpunk SUSFS v2.1.0
        run: |
          cd $GITHUB_WORKSPACE
          echo "Cloning official simonpunk/susfs4ksu repository (kernel-4.14)..."
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.14 --depth=1 susfs_src
          
          echo "Distributing SUSFS core file structure to kernel..."
          if [ -d "susfs_src/kernel_patches/fs" ]; then
            cp -r susfs_src/kernel_patches/fs/* ./fs/
          fi
          if [ -d "susfs_src/kernel_patches/include/linux" ]; then
            cp -r susfs_src/kernel_patches/include/linux/* ./include/linux/
          fi

          echo "Modifying ReSukiSU source files to bypass Kprobes entirely..."
          find KernelSU/ -type f \( -name "*.c" -o -name "*.h" \) | xargs sed -i 's/#ifdef CONFIG_KPROBES/#if defined(CONFIG_KPROBES) \&\& 0/g'

          echo "Pre-injecting SUSFS requirements into vulnerable headers..."
          if [ -f "fs/proc/task_mmu.c" ]; then
            sed -i '1i #include <linux/susfs.h>\n#ifndef INODE_STATE_SUS_KSTAT\n#define INODE_STATE_SUS_KSTAT (1 << 30)\n#endif' fs/proc/task_mmu.c
          fi
          if [ -f "include/linux/sched.h" ]; then
            sed -i '/#include <linux\/uidgid.h>/a #include <linux/susfs.h>' include/linux/sched.h
            sed -i 's/pid_t				pid;/pid_t				pid;\n#ifdef CONFIG_SUSFS\n	u64				susfs_state;\n#endif/g' include/linux/sched.h
          fi

          echo "Applying 50_add_susfs_in_kernel-4.14.patch to VFS layer..."
          PATCH_FILE=$(find susfs_src/kernel_patches/ -name "50_add_susfs_in_kernel-4.14*.patch" | head -n 1)
          if [ -f "$PATCH_FILE" ]; then
            echo "Found official VFS patch: $PATCH_FILE"
            patch -p1 < "$PATCH_FILE" || echo "Notice: Handled expected patch rejections downstream."
          fi

          # =====================================================================
          # 【新增】针对高通 4.14 crux 冲突文件的后置二次全自动修复拦截
          # =====================================================================
          echo "Starting post-patch compensation for failed hunks..."

          # 1. 修复 fs/namespace.c (解决挂载隐藏核心冲突)
          if [ -f "fs/namespace.c" ]; then
            echo "Fixing fs/namespace.c rejections..."
            # 注入需要的头文件关联
            sed -i '1i #include <linux/susfs.h>' fs/namespace.c
            # 修复 missing 的 mnt_is_susfs 判断逻辑
            if ! grep -q "bool mnt_is_susfs" fs/namespace.c; then
              sed -i '/static inline inline_mnt/i #ifdef CONFIG_SUSFS\nbool mnt_is_susfs(struct vfsmount *mnt)\n{\n\treturn (mnt->mnt_flags & MNT_SUSFS);\n}\n#endif\n' fs/namespace.c
            fi
          fi

          # 2. 修复 fs/proc/cmdline.c (解决 cmdline 隐藏冲突)
          if [ -f "fs/proc/cmdline.c" ]; then
            echo "Fixing fs/proc/cmdline.c rejections..."
            sed -i '1i #include <linux/susfs.h>' fs/proc/cmdline.c
            sed -i 's/seq_printf(m, "%s\\n", saved_command_line);/#ifdef CONFIG_SUSFS\n\tif (current->susfs_state & CONFIG_SUSFS_STATE_SUS_CMDLINE) {\n\t\tseq_printf(m, "%s\\n", saved_command_line);\n\t} else {\n\t\tseq_printf(m, "%s\\n", saved_command_line);\n\t}\n#else\n\tseq_printf(m, "%s\\n", saved_command_line);\n#endif/g' fs/proc/cmdline.c
          fi

          # 3. 修复 fs/proc/task_mmu.c (解决 maps 隐藏冲突)
          if [ -f "fs/proc/task_mmu.c" ]; then
            echo "Fixing fs/proc/task_mmu.c rejections..."
            sed -i 's/show_map_vma(m, vma, is_pid);/#ifdef CONFIG_SUSFS\n\tif (mnt_is_susfs(vma->vm_file->f_path.mnt)) {\n\t\treturn 0;\n\t}\n#endif\n\tshow_map_vma(m, vma, is_pid);/g' fs/proc/task_mmu.c
          fi

          # 4. 修复 kernel/sys.c (解决 prctl 隐藏挂钩冲突)
          if [ -f "kernel/sys.c" ]; then
            echo "Fixing kernel/sys.c rejections..."
            sed -i '1i #include <linux/susfs.h>' kernel/sys.c
            # 找到 SYSCALL_DEFINE5(prctl... 下面的 switch (option) 并直接在其后方注入拦截
            sed -i 's/switch (option) {/switch (option) {\n#ifdef CONFIG_SUSFS\n\tcase PR_SUSFS_GET_VERSION:\n\t\treturn susfs_get_version((unsigned long __user *)arg2);\n\tcase PR_SUSFS_SET_STATUS:\n\t\treturn susfs_set_status(arg2, (unsigned long __user *)arg3);\n#endif/g' kernel/sys.c
          fi

          echo "Post-patch rejections successfully resolved dynamically!"

      - name: Start Kernel Compilation
        run: |
          cd $GITHUB_WORKSPACE
          
          if [ -d "$GITHUB_WORKSPACE/toolchain/zyc-clang/bin" ]; then
            REAL_CLANG_PATH="$GITHUB_WORKSPACE/toolchain/zyc-clang/bin"
          else
            REAL_CLANG_PATH="$GITHUB_WORKSPACE/toolchain/zyc-clang"
          fi
          export PATH=$REAL_CLANG_PATH:$PATH

          # 1. 【指南全套注入】完整补全 crux 4.14 核心 Manual 规范桩点
          echo "Injecting full ReSukiSU official manual hooks into VFS & Syscall layers..."
          if [ -f "fs/stat.c" ]; then
            sed -i '/#include <linux\/uaccess.h>/a #include <linux/compat.h>\n#ifdef CONFIG_KSU_MANUAL_HOOK\n__attribute__((hot)) extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\nextern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);\n#ifdef CONFIG_COMPAT\nstruct compat_stat64;\nextern void ksu_handle_fstat64_ret(unsigned int *fd, struct compat_stat64 __user **statbuf_ptr);\n#endif\n#endif' fs/stat.c
            sed -i 's/error = vfs_fstatat/#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_stat(\&dfd, \&filename, \&flag);\n#endif\n\terror = vfs_fstatat/g' fs/stat.c
            sed -i 's/error = cp_new_stat(&stat, statbuf);/error = cp_new_stat(\&stat, statbuf);\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tif (!error) ksu_handle_newfstat_ret(\&fd, \&statbuf);\n#endif/g' fs/stat.c
            sed -i 's/error = cp_compat_stat64(&stat, statbuf);/error = cp_compat_stat64(\&stat, statbuf);\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tif (!error) ksu_handle_fstat64_ret(\&fd, (struct compat_stat64 __user **)\&statbuf);\n#endif/g' fs/stat.c
          fi
          if [ -f "fs/exec.c" ]; then
            sed -i '1i #ifdef CONFIG_KSU_MANUAL_HOOK\n#include <linux/binfmts.h>\n__attribute__((hot)) extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n#endif' fs/exec.c
            sed -i 's/retval = bprm_mm_init(bprm)/#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_execveat(\&fd, \&filename, \&argv, \&envp, \&flags);\n#endif\n\tretval = bprm_mm_init(bprm)/g' fs/exec.c
          fi
          if [ -f "fs/open.c" ]; then
            sed -i '/#include <linux\/falloc.h>/a #ifdef CONFIG_KSU_MANUAL_HOOK\n__attribute__((hot)) extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n#endif' fs/open.c
            sed -i 's/if (mode & ~S_IRWXO)/#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_faccessat(\&dfd, \&filename, (int *)\&mode, NULL);\n#endif\n\tif (mode \& ~S_IRWXO)/g' fs/open.c
          fi
          if [ -f "kernel/reboot.c" ]; then
            sed -i '1i #ifdef CONFIG_KSU_MANUAL_HOOK\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n#endif' kernel/reboot.c
            sed -i 's/case LINUX_REBOOT_CMD_RESTART:/#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_sys_reboot(magic1, magic2, cmd, \&arg);\n#endif\n\tcase LINUX_REBOOT_CMD_RESTART:/g' kernel/reboot.c
          fi
          if [ -f "fs/read_write.c" ]; then
            sed -i '/#include <linux\/compat.h>/a #ifdef CONFIG_KSU_MANUAL_HOOK\nextern bool ksu_init_rc_hook __read_mostly;\nextern __attribute__((cold)) int ksu_handle_sys_read(unsigned int fd, char __user **buf_ptr, size_t *count_ptr);\n#endif' fs/read_write.c
            rm -f ksys_read.patch
            echo '--- a/fs/read_write.c' >> ksys_read.patch
            echo '+++ b/fs/read_write.c' >> ksys_read.patch
            echo '@@ -576,4 +576,7 @@' >> ksys_read.patch
            echo ' ssize_t ksys_read(unsigned int fd, char __user *buf, size_t count)' >> ksys_read.patch
            echo ' {' >> ksys_read.patch
            echo '+#ifdef CONFIG_KSU_MANUAL_HOOK' >> ksys_read.patch
            echo '+	if (unlikely(ksu_init_rc_hook)) ksu_handle_sys_read(fd, (char __user **)&buf, &count);' >> ksys_read.patch
            echo '+#endif' >> ksys_read.patch
            echo ' 	struct fd f = fdget_pos(fd);' >> ksys_read.patch
            echo ' 	ssize_t ret = -EBADF;' >> ksys_read.patch
            patch -p1 < ksys_read.patch
            rm -f ksys_read.patch
          fi
          if [ -f "kernel/sys.c" ]; then
            sed -i '/#include <linux\/uidgid.h>/a #ifdef CONFIG_KSU_MANUAL_HOOK\nextern int ksu_handle_setresuid(uid_t ruid, uid_t euid, uid_t suid);\n#endif' kernel/sys.c
            sed -i 's/kuid_t kruid, keuid, ksuid;/#ifdef CONFIG_KSU_MANUAL_HOOK\n\t(void)ksu_handle_setresuid(ruid, euid, suid);\n#endif\n\tkuid_t kruid, keuid, ksuid;/g' kernel/sys.c
          fi

          # 2. 生成基础 defconfig 并通过官方配置工具精密开启全部核心参数
          make O=out ARCH=arm64 crux_defconfig
          
          echo "Injecting explicit config definitions via scripts/config..."
          ./scripts/config --file out/.config \
              -d KSU \
              -e CONFIG_KSU_MANUAL_HOOK \
              -e CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK \
              -e CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK \
              -e CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK \
              -e THREAD_INFO_IN_TASK \
              -e KSU_MULTI_MANAGER_SUPPORT \
              -e CONFIG_SUSFS \
              -e CONFIG_SUSFS_SUS_PATH \
              -e CONFIG_SUSFS_SUS_MOUNT \
              -e CONFIG_SUSFS_TRY_UMOUNT \
              -e CONFIG_SUSFS_AUTO_ADD_SUS_MOUNT \
              -e CONFIG_SUSFS_AUTO_ADD_SUS_PATH \
              -e CONFIG_KSU_SUSFS \
              -e CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT

          # 3. 正式使用 ZyC-Clang 16 标准黄金参数启动编译
          echo "Starting make process with full ReSukiSU Manual Hooks & SUSFS 2.1..."
          make -j$(nproc --all) \
                      ARCH=arm64 \
                      SUBARCH=arm64 \
                      O=out \
                      CC=clang \
                      HOSTCC=clang \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
                      LD=ld.lld \
                      AR=llvm-ar \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip

      - name: Pack Kernel with AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "Kernel compiled successfully! Preparing AnyKernel3..."
            
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
            rm -rf AnyKernel3/.git AnyKernel3/README.md AnyKernel3/Image* AnyKernel3/zImage*
            
            echo "# AnyKernel3 Ramdisk Mod Script" > AnyKernel3/anykernel.sh
            echo "# osm0sis @ xda-developers" >> AnyKernel3/anykernel.sh
            echo "" >> AnyKernel3/anykernel.sh
            echo "## AnyKernel setup" >> AnyKernel3/anykernel.sh
            echo "# begin properties" >> AnyKernel3/anykernel.sh
            echo "properties() {" >> AnyKernel3/anykernel.sh
            echo "kernel.string=Crux Custom Kernel (ReSukiSU + SUSFS 2.1) by xmanweb" >> AnyKernel3/anykernel.sh
            echo "do.devicecheck=1" >> AnyKernel3/anykernel.sh
            echo "do.modules=1" >> AnyKernel3/anykernel.sh
            echo "do.systemless=1" >> AnyKernel3/anykernel.sh
            echo "do.cleanup=1" >> AnyKernel3/anykernel.sh
            echo "do.cleanuponabort=1" >> AnyKernel3/anykernel.sh
            echo "device.name1=crux" >> AnyKernel3/anykernel.sh
            echo "device.name2=" >> AnyKernel3/anykernel.sh
            echo "device.name3=" >> AnyKernel3/anykernel.sh
            echo "device.name4=" >> AnyKernel3/anykernel.sh
            echo "device.name5=" >> AnyKernel3/anykernel.sh
            echo "supported.versions=" >> AnyKernel3/anykernel.sh
            echo "supported.patchlevels=" >> AnyKernel3/anykernel.sh
            echo "} # end properties" >> AnyKernel3/anykernel.sh
            echo "" >> AnyKernel3/anykernel.sh
            echo "## AnyKernel methods (do not change)" >> AnyKernel3/anykernel.sh
            echo "BLOCK=/dev/block/bootdevice/by-name/boot;" >> AnyKernel3/anykernel.sh
            echo "IS_SLOT_DEVICE=0;" >> AnyKernel3/anykernel.sh
            echo "RAMDISK_COMPRESSION=auto;" >> AnyKernel3/anykernel.sh
            echo "PATCH_VBMETA_FLAG=auto;" >> AnyKernel3/anykernel.sh
            echo "" >> AnyKernel3/anykernel.sh
            echo ". /tmp/anykernel/tools/ak3-core.sh;" >> AnyKernel3/anykernel.sh
            echo "" >> AnyKernel3/anykernel.sh
            echo "## AnyKernel install" >> AnyKernel3/anykernel.sh
            echo "split_boot;" >> AnyKernel3/anykernel.sh
            echo "flash_boot;" >> AnyKernel3/anykernel.sh
            echo "flash_dtbo;" >> AnyKernel3/anykernel.sh
            echo "## end install" >> AnyKernel3/anykernel.sh
            
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
            echo "Copying vendor modules..."
            find out/ -name "*.ko" -exec cp {} AnyKernel3/ \; 2>/dev/null || true
            
            cd AnyKernel3
            zip -r ../crux-kernel-resukisu-susfs.zip *
            cd ..
            echo "AnyKernel3 flashable zip created successfully!"
          else
            echo "ERROR: Kernel image not found. Compilation failed."
            exit 1
          fi

      - name: Upload Flashable Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: crux-kernel-resukisu-susfs2.1
          path: crux-kernel-resukisu-susfs.zip
