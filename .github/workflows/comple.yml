name: Compile Crux Kernel (ReSukiSU & SUSFS 2.1 - Native Hook)

on:
  push:
    branches:
      - test
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FINAL_ZIP_NAME: ""
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: test

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev texinfo \
            libgmp3-dev libmpfr-dev libmpc-dev libcap-dev zlib1g-dev python3 \
            bison flex ccache libelf-dev lz4 liblz4-tool libstdc++6 openjdk-11-jdk zip unzip curl git

      - name: Fetch ZyC-Clang 16 Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          echo "Downloading latest ZyC-Clang 16..."
          curl -LO https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz
          mkdir -p zyc-clang
          tar -xzf Clang-16.0.6-20260510.tar.gz -C zyc-clang

      - name: "PHASE 1: Apply SUSFS 4.14 Baseline Patch"
        run: |
          cd $GITHUB_WORKSPACE
          echo "====================================================================="
          echo "  STEP 1: Download & Apply Custom Non-GKI 4.14 Baseline Patch        "
          echo "====================================================================="
          curl -fsSL "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/Patch/susfs_patch_to_4.14.patch" -o susfs_to_414.patch
          
          if [ -f "susfs_to_414.patch" ]; then
            echo "Applying susfs_to_414.patch to the clean kernel tree..."
            patch -p1 < susfs_to_414.patch || echo "Notice: Baseline patch finished. Rej files handled via subsequent manual step injection."
          fi

      - name: "PHASE 2: Integrate Official ReSukiSU"
        run: |
          cd $GITHUB_WORKSPACE
          echo "Integrating Official ReSukiSU environment..."
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main || curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: "PHASE 3: Apply JackA1ltman Native Non-GKI Core Infrastructure"
        run: |
          cd $GITHUB_WORKSPACE
          echo "====================================================================="
          echo "  STEP 1: Download & Execute JackA1ltman Inline Hook Script         "
          echo "====================================================================="
          curl -fsSL "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/susfs_inline_hook_patches.sh" -o susfs_inline_hook_patches.sh
          chmod +x susfs_inline_hook_patches.sh
          echo "Executing JackA1ltman inline patch script..."
          bash susfs_inline_hook_patches.sh || echo "Notice: VFS tree adaptation finished."
          
          # 修复原本脚本的拼写碎裂错误
          find drivers/Kconfig KernelSU/ -type f \( -name "*.c" -o -name "*.h" \) | xargs sed -i 's/linux\/susfs_def.h/linux\/susfs.h/g' 2>/dev/null || true

      - name: Start Kernel Compilation
        run: |
          cd $GITHUB_WORKSPACE
          
          if [ -d "$GITHUB_WORKSPACE/toolchain/zyc-clang/bin" ]; then
            REAL_CLANG_PATH="$GITHUB_WORKSPACE/toolchain/zyc-clang/bin"
          else
            REAL_CLANG_PATH="$GITHUB_WORKSPACE/toolchain/zyc-clang"
          fi
          export PATH=$REAL_CLANG_PATH:$PATH

          # =====================================================================
          # "PHASE 4: Fix SUSFS Patch Failures & Precision Hook Injection"
          # =====================================================================
          
          # 【修复 1】补救 kernel/sys.c 中脱靶的 newuname 伪造
          if [ -f "kernel/sys.c" ]; then
            echo "Manually injecting failed SUSFS code into kernel/sys.c..."
            sed -i '/SYSCALL_DEFINE1(newuname/i #ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\nextern struct static_key_false susfs_is_uname_spoof_buffer_set;\nextern void susfs_spoof_uname(struct new_utsname* tmp);\n#endif' kernel/sys.c
            sed -i '/memcpy(&tmp, utsname(), sizeof(tmp));/a #ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\n\tif (static_branch_likely(&susfs_is_uname_spoof_buffer_set))\n\t\tsusfs_spoof_uname(&tmp);\n#endif' kernel/sys.c
          fi

          # 【修复 2】补救 fs/namespace.c 中脱靶的 unshared mnt 绕过
          if [ -f "fs/namespace.c" ]; then
            echo "Manually injecting failed SUSFS code into fs/namespace.c..."
            sed -i '/int id = mnt->mnt_id;/a #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n\tif (mnt->mnt.mnt_flags & VFSMOUNT_MNT_FLAGS_KSU_UNSHARED_MNT)\n\t\treturn;\n#endif' fs/namespace.c
            sed -i '/if (!ida_pre_get(&mnt_group_ida, GFP_KERNEL))/i #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n\tif (susfs_is_current_ksu_domain()) {\n\t\tif (!ida_pre_get(&mnt_group_ida, GFP_KERNEL))\n\t\t\treturn -ENOMEM;\n\t\tres = ida_get_new_above(&mnt_group_ida, DEFAULT_KSU_MNT_GROUP_ID, \&mnt->mnt_group_id);\n\t\tgoto bypass_orig_flow;\n\t}\n#endif' fs/namespace.c
            sed -i '/res = ida_get_new_above(&mnt_group_ida,/i #ifndef CONFIG_KSU_SUSFS_SUS_MOUNT' fs/namespace.c
            sed -i '/mnt_group_start = mnt->mnt_group_id + 1;/i #endif\nbypass_orig_flow:' fs/namespace.c
          fi

          # 【修复 3】补救 fs/proc/cmdline.c ——【已修复行号带连字符导致的 sed 报错】
          if [ -f "fs/proc/cmdline.c" ]; then
            echo "Manually injecting failed SUSFS code into fs/proc/cmdline.c..."
            # 1. 注入顶部声明
            sed -i '/static int cmdline_proc_show/i #ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\nextern struct static_key_false susfs_is_fake_cmdline_or_bootconfig_buffer_set;\nextern void susfs_spoof_cmdline_or_bootconfig(struct seq_file *m);\n#endif' fs/proc/cmdline.c
            
            # 2. 纯安全 awk 过滤：寻找函数名后下方的第一个左大括号，彻底过滤非数字字符
            CMDLINE_LN=$(awk '/static int cmdline_proc_show/,/{/{if($0 ~ /{/){print NR; exit}}' fs/proc/cmdline.c)
            if [ ! -z "$CMDLINE_LN" ]; then
              echo "Pure clean line number locked at: $CMDLINE_LN"
              sed -i "${CMDLINE_LN}a #ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\n\tif (static_branch_likely(&susfs_is_fake_cmdline_or_bootconfig_buffer_set)) {\n\t\tsusfs_spoof_cmdline_or_bootconfig(m);\n\t\tseq_printf(m, \"%s\\\\n\");\n\t\treturn 0;\n\t}\n#endif" fs/proc/cmdline.c
            fi
          fi

          # 【修复 4】全面抢救 fs/proc/task_mmu.c 中脱靶的 show_smap 与头文件引用
          if [ -f "fs/proc/task_mmu.c" ]; then
            echo "Manually injecting failed SUSFS code into fs/proc/task_mmu.c..."
            sed -i '/#include <linux\/uaccess.h>/i #if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n#include <linux/susfs.h>\n#endif' fs/proc/task_mmu.c
            sed -i '/if (!rollup_mode)/a #ifdef CONFIG_KSU_SUSFS_SUS_MAP\n\tif (vma->vm_file) {\n\t\tif (SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file)))\n\t\t\treturn 0;\n\t}\n#endif' fs/proc/task_mmu.c
            sed -i '/arch_show_smap(m, vma);/i #ifdef CONFIG_KSU_SUSFS_SUS_MAP\n\tif (vma->vm_file) {\n\t\tif (vma->vm_file && SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file)))\n\t\t\tgoto bypass_orig_flow;\n\t}\n#endif' fs/proc/task_mmu.c
            sed -i '/m_cache_vma(m, vma);/i #ifdef CONFIG_KSU_SUSFS_SUS_MAP\nbypass_orig_flow:\n#endif' fs/proc/task_mmu.c
          fi

          # =====================================================================
          # 既有正常逻辑：老哥你自己的 Precision Hook 注入
          # =====================================================================
          echo "Modifying drivers/input/input.c safely with clean single-line variables..."
          if [ -f "drivers/input/input.c" ]; then
            BRACE_LINE=$(grep -n "void input_event" drivers/input/input.c | head -n 1 | cut -d: -f1)
            TARGET_OFFSET=$(tail -n +$BRACE_LINE drivers/input/input.c | grep -n "{" | head -n 1 | cut -d: -f1)
            REAL_INJECT_LINE=$((BRACE_LINE + TARGET_OFFSET - 1))
            
            ANCHOR_LINE=$(grep -n "if (is_event_supported" drivers/input/input.c | head -n 1 | cut -d: -f1)
            
            sed -i "${REAL_INJECT_LINE}s@{ @{ extern bool ksu_input_hook __read_mostly; extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value); @g" drivers/input/input.c
            sed -i "${ANCHOR_LINE}s@{ @{ if (unlikely(ksu_input_hook)) ksu_handle_input_handle_event(\x26type, \x26code, \x26value); @g" drivers/input/input.c
            echo "drivers/input/input.c hook injection accomplished cleanly."
          fi

          echo "Injecting remaining native ReSukiSU inline hooks into kernel core..."
          
          # 1. 挂钩 kernel/sys.c (处理 setresuid)
          if [ -f "kernel/sys.c" ]; then
            SYS_LINE=$(grep -n "k_sys_setresuid(uid_t ruid" kernel/sys.c || grep -n "SYSCALL_DEFINE3(setresuid" kernel/sys.c | head -n 1 | cut -d: -f1)
            if [ ! -z "$SYS_LINE" ]; then
              SYS_OFFSET=$(tail -n +$SYS_LINE kernel/sys.c | grep -n "{" | head -n 1 | cut -d: -f1)
              REAL_SYS_LN=$((SYS_LINE + SYS_OFFSET - 1))
              sed -i "${REAL_SYS_LN}s@{ @{ extern int ksu_handle_setresuid(uid_t ruid, uid_t euid, uid_t suid); ksu_handle_setresuid(ruid, euid, suid); @g" kernel/sys.c
            fi
          fi

          # 2. 挂钩 kernel/reboot.c (处理 sys_reboot)
          if [ -f "kernel/reboot.c" ]; then
            REBOOT_LINE=$(grep -n "SYSCALL_DEFINE4(reboot" kernel/reboot.c | head -n 1 | cut -d: -f1)
            if [ ! -z "$REBOOT_LINE" ]; then
              REBOOT_OFFSET=$(tail -n +$REBOOT_LINE kernel/reboot.c | grep -n "{" | head -n 1 | cut -d: -f1)
              REAL_REBOOT_LN=$((REBOOT_LINE + REBOOT_OFFSET - 1))
              sed -i "${REAL_REBOOT_LN}s@{ @{ extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user *arg); ksu_handle_sys_reboot(magic1, magic2, cmd, arg); @g" kernel/reboot.c
            fi
          fi

          # 3. fs/open.c
          if [ -f "fs/open.c" ]; then
            FAC_LINE=$(grep -n "do_faccessat(int dfd" fs/open.c || grep -n "SYSCALL_DEFINE3(faccessat" fs/open.c | head -n 1 | cut -d: -f1)
            if [ ! -z "$FAC_LINE" ]; then
              FAC_OFFSET=$(tail -n +$FAC_LINE fs/open.c | grep -n "{" | head -n 1 | cut -d: -f1)
              REAL_FAC_LN=$((FAC_LINE + FAC_OFFSET - 1))
              sed -i "${REAL_FAC_LN}s@{ @{ extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags); ksu_handle_faccessat(\x26dfd, \x26filename, (int *)\x26mode, NULL); @g" fs/open.c
            fi
          fi

          # 4. fs/exec.c (处理 execveat)
          if [ -f "fs/exec.c" ]; then
            EXEC_LINE=$(grep -n "do_execveat_common(int dfd" fs/exec.c || grep -n "__do_execveat_file(int dfd" fs/exec.c | head -n 1 | cut -d: -f1)
            if [ ! -z "$EXEC_LINE" ]; then
              EXEC_OFFSET=$(tail -n +$EXEC_LINE fs/exec.c | grep -n "{" | head -n 1 | cut -d: -f1)
              REAL_EXEC_LN=$((EXEC_LINE + EXEC_OFFSET - 1))
              sed -i "${REAL_EXEC_LN}s@{ @{ extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags); ksu_handle_execveat(\x26fd, \x26filename, \x26argv, \x26envp, \x26flags); @g" fs/exec.c
            fi
          fi

          # 5. fs/stat.c (处理 vfs_statx / vfs_fstatat)
          if [ -f "fs/stat.c" ]; then
            STAT_LINE=$(grep -n "vfs_fstatat(int dfd" fs/stat.c || grep -n "vfs_statx(int dfd" fs/stat.c | head -n 1 | cut -d: -f1)
            if [ ! -z "$STAT_LINE" ]; then
              STAT_OFFSET=$(tail -n +$STAT_LINE fs/stat.c | grep -n "{" | head -n 1 | cut -d: -f1)
              REAL_STAT_LN=$((STAT_LINE + STAT_OFFSET - 1))
              sed -i "${REAL_STAT_LN}s@{ @{ extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags); ksu_handle_stat(\x26dfd, \x26filename, \x26flag); @g" fs/stat.c
            fi
          fi

          # 6. fs/read_write.c (处理 sys_read)
          if [ -f "fs/read_write.c" ]; then
            VFS_READ_LINE=$(grep -n "ssize_t vfs_read(struct file" fs/read_write.c | head -n 1 | cut -d: -f1)
            if [ ! -z "$VFS_READ_LINE" ]; then
              VFS_READ_OFFSET=$(tail -n +$VFS_READ_LINE fs/read_write.c | grep -n "{" | head -n 1 | cut -d: -f1)
              REAL_VFS_LN=$((VFS_READ_LINE + VFS_READ_OFFSET - 1))
              sed -i "${REAL_VFS_LN}s@{ @{ extern int ksu_handle_sys_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos_ptr); ksu_handle_sys_read(\x26file, (char __user **)\x26buf, \x26count, \x26pos); @g" fs/read_write.c
            fi
          fi
          
          # 生成原本的基础默认配置
          make O=out ARCH=arm64 crux_defconfig
          
          # 显式激活编译配置项
          echo "Injecting explicit config definitions using provided configuration..."
          ./scripts/config --file out/.config \
              -e KSU \
              -e THREAD_INFO_IN_TASK \
              -e KSU_SUSFS \
              -e KSU_SUSFS_SUS_PATH \
              -e KSU_SUSFS_SUS_MOUNT \
              -e KSU_SUSFS_SUS_KSTAT \
              -e KSU_SUSFS_SPOOF_UNAME \
              -e KSU_SUSFS_ENABLE_LOG \
              -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
              -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
              -e KSU_SUSFS_OPEN_REDIRECT \
              -e KSU_SUSFS_SUS_MAP \
              -e KSU_MULTI_MANAGER_SUPPORT

          # 刷新并锁定依赖
          echo "Syncing configs via silentoldconfig..."
          make O=out ARCH=arm64 silentoldconfig

          # 正式执行内核编译
          echo "Starting make process with provided configuration state..."
          make -j$(nproc --all) \
                      ARCH=arm64 \
                      SUBARCH=arm64 \
                      O=out \
                      CC=clang \
                      HOSTCC=clang \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
                      LD=ld.lld \
                      AR=llvm-ar \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip
                      
      - name: Pack Kernel with AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "Kernel compiled successfully! Preparing AnyKernel3..."
            
            BUILD_DATE=$(date -d "+8 hours" +%Y%m%d_%H%M)
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            ZIP_NAME="crux-kernel-resukisu-susfs-${BUILD_DATE}-${SHORT_SHA}.zip"
            
            echo "FINAL_ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
            
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
            rm -rf AnyKernel3/.git AnyKernel3/README.md AnyKernel3/Image* AnyKernel3/zImage*
            
            echo '# AnyKernel3 Ramdisk Mod Script' > AnyKernel3/anykernel.sh
            echo '# osm0sis @ xda-developers' >> AnyKernel3/anykernel.sh
            echo '' >> AnyKernel3/anykernel.sh
            echo '## AnyKernel setup' >> AnyKernel3/anykernel.sh
            echo '# begin properties' >> AnyKernel3/anykernel.sh
            echo 'properties() { ' >> AnyKernel3/anykernel.sh
            echo "kernel.string=Crux ReSukiSU SUSFS 2.1 - ${BUILD_DATE} - ${SHORT_SHA} - by xmanweb" >> AnyKernel3/anykernel.sh
            echo 'do.devicecheck=1' >> AnyKernel3/anykernel.sh
            echo 'do.modules=0' >> AnyKernel3/anykernel.sh
            echo 'do.systemless=1' >> AnyKernel3/anykernel.sh
            echo 'do.cleanup=1' >> AnyKernel3/anykernel.sh
            echo 'do.cleanuponabort=1' >> AnyKernel3/anykernel.sh
            echo "device.name1=crux" >> AnyKernel3/anykernel.sh
            echo 'device.name2=' >> AnyKernel3/anykernel.sh
            echo 'device.name3=' >> AnyKernel3/anykernel.sh
            echo 'device.name4=' >> AnyKernel3/anykernel.sh
            echo 'device.name5=' >> AnyKernel3/anykernel.sh
            echo 'supported.versions=' >> AnyKernel3/anykernel.sh
            echo 'supported.patchlevels=' >> AnyKernel3/anykernel.sh
            echo '} # end properties' >> AnyKernel3/anykernel.sh
            echo '' >> AnyKernel3/anykernel.sh
            echo '## AnyKernel methods (do not change)' >> AnyKernel3/anykernel.sh
            echo 'BLOCK=boot;' >> AnyKernel3/anykernel.sh
            echo 'IS_SLOT_DEVICE=0;' >> AnyKernel3/anykernel.sh
            echo 'RAMDISK_COMPRESSION=auto;' >> AnyKernel3/anykernel.sh
            echo 'PATCH_VBMETA_FLAG=auto;' >> AnyKernel3/anykernel.sh
            echo '' >> AnyKernel3/anykernel.sh
            echo '. /tmp/anykernel/tools/ak3-core.sh;' >> AnyKernel3/anykernel.sh
            echo '' >> AnyKernel3/anykernel.sh
            echo '## AnyKernel install' >> AnyKernel3/anykernel.sh
            echo 'split_boot;' >> AnyKernel3/anykernel.sh
            echo 'flash_boot;' >> AnyKernel3/anykernel.sh
            echo 'flash_dtbo;' >> AnyKernel3/anykernel.sh
            echo '## end install' >> AnyKernel3/anykernel.sh
            
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
            
            cd AnyKernel3
            zip -r ../${ZIP_NAME} *
            cd ..
            echo "AnyKernel3 flashable zip created successfully: ${ZIP_NAME}"
          else
            echo "ERROR: Kernel image not found. Compilation failed."
            exit 1
          fi

      - name: Upload Flashable Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FINAL_ZIP_NAME }}
          path: ${{ env.FINAL_ZIP_NAME }}
